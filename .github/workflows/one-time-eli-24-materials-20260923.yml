el resultado.\nINDICACIONES PARA EL ALUMNO\nTrabaja individualmente en tu copia personalizada de este documento. Retoma las tres fichas de la Tarea 03; no inventes hechos como si estuvieran comprobados. Si no cuentas con un dato, decláralo como supuesto o información pendiente de verificar. Utiliza un entorno simulado o datos ficticios; nunca incluyas credenciales, expedientes identificables ni datos personales reales.\nCRITERIOS DE CLASIFICACIÓN\nOrigen: interno / externo / natural-ambiental / tecnológico; indica el principal y justifica los factores concurrentes cuando proceda.\nActivo principalmente afectado: datos, servicio, infraestructura, equipo, proceso o personas (aclara cuál y su valor).\nNaturaleza y efecto: pérdida de confidencialidad, integridad, disponibilidad o trazabilidad y consecuencia operativa, jurídica o reputacional; estas dimensiones pueden coincidir.\nProbabilidad estimada: BAJA si se requiere una coincidencia poco habitual y hay controles efectivos; MEDIA si la exposición es plausible y los controles son parciales; ALTA si la exposición es frecuente o sostenida con controles insuficientes. Sustenta en hechos o supuestos.\nImpacto estimado: BAJO si la consecuencia es acotada y reversible sin afectación sustantiva; MEDIO si interrumpe un servicio o afecta información de forma recuperable; ALTO si compromete de manera severa un servicio crítico, datos sensibles o derechos. Explica el alcance y la recuperación.\nMatriz cualitativa: combina probabilidad (filas BAJA, MEDIA, ALTA) e impacto (columnas BAJO, MEDIO, ALTO). Regla de prioridad: probabilidad BAJA + impacto BAJO/MEDIO = BAJA; BAJA + ALTO = MEDIA; MEDIA + BAJO = BAJA; MEDIA + MEDIO = MEDIA; MEDIA + ALTO = ALTA; ALTA + BAJO = MEDIA; ALTA + MEDIO/ALTO = ALTA. Esta es una convención didáctica para ordenar la revisión, no una probabilidad matemática exacta ni una obligación legal.\nRiesgo inherente: estimación antes de considerar controles existentes. Riesgo residual: estimación posterior a controles que realmente estén operando; no asumas que un control propuesto ya existe.\nDESARROLLO\n1. Revisa las tres fichas preparatorias y redacta cada riesgo como «si ocurre [amenaza] sobre [activo] aprovechando [vulnerabilidad/exposición], podría producir [impacto]».\n2. Para cada riesgo, completa todos los campos de la ficha estructurada siguiente.\n3. Aplica la misma escala y regla de la matriz a los tres riesgos. Declara si tu valoración es inherente o residual y anota los controles existentes que respaldan el cambio.\n4. Ordena los tres riesgos por prioridad. En caso de empate, explica qué información adicional necesitarías para decidir el orden de atención.\n5. Propón una acción inicial de tratamiento o seguimiento para cada riesgo y una evidencia verificable de que se aplicó o evaluó.\n6. Compara dos riesgos: explica por qué una categoría de origen no basta para fijar prioridad y cómo cambiaría tu decisión si cambian los supuestos de exposición o impacto.\nFICHA 1 — RIESGO:\nEnunciado completo:\nActivo y razón de su importancia:\nAmenaza:\nVulnerabilidad o exposición:\nOrigen principal y justificación:\nNaturaleza y consecuencias:\nProbabilidad inherente (B/M/A), evidencia o supuesto:\nImpacto inherente (B/M/A), alcance y evidencia o supuesto:\nControles EXISTENTES y evidencia de su operación (o «No verificado»):\nProbabilidad e impacto residuales, solo si pueden justificarse:\nValoración usada para la matriz (inherente o residual):\nCelda de la matriz y prioridad (B/M/A):\nInformación faltante e incertidumbre:\nTratamiento o seguimiento inicial y evidencia esperada:\nFICHA 2 — RIESGO:\nEnunciado completo:\nActivo y razón de su importancia:\nAmenaza:\nVulnerabilidad o exposición:\nOrigen principal y justificación:\nNaturaleza y consecuencias:\nProbabilidad inherente (B/M/A), evidencia o supuesto:\nImpacto inherente (B/M/A), alcance y evidencia o supuesto:\nControles EXISTENTES y evidencia de su operación (o «No verificado»):\nProbabilidad e impacto residuales, solo si pueden justificarse:\nValoración usada para la matriz (inherente o residual):\nCelda de la matriz y prioridad (B/M/A):\nInformación faltante e incertidumbre:\nTratamiento o seguimiento inicial y evidencia esperada:\nFICHA 3 — RIESGO:\nEnunciado completo:\nActivo y razón de su importancia:\nAmenaza:\nVulnerabilidad o exposición:\nOrigen principal y justificación:\nNaturaleza y consecuencias:\nProbabilidad inherente (B/M/A), evidencia o supuesto:\nImpacto inherente (B/M/A), alcance y evidencia o supuesto:\nControles EXISTENTES y evidencia de su operación (o «No verificado»):\nProbabilidad e impacto residuales, solo si pueden justificarse:\nValoración usada para la matriz (inherente o residual):\nCelda de la matriz y prioridad (B/M/A):\nInformación faltante e incertidumbre:\nTratamiento o seguimiento inicial y evidencia esperada:\nMATRIZ CONSOLIDADA DE LOS TRES RIESGOS\nRiesgo 1 | Origen: ____ | Activo: ____ | Naturaleza: ____ | Probabilidad: ____ | Impacto: ____ | Prioridad: ____ | Fundamento de la prioridad: ____\nRiesgo 2 | Origen: ____ | Activo: ____ | Naturaleza: ____ | Probabilidad: ____ | Impacto: ____ | Prioridad: ____ | Fundamento de la prioridad: ____\nRiesgo 3 | Origen: ____ | Activo: ____ | Naturaleza: ____ | Probabilidad: ____ | Impacto: ____ | Prioridad: ____ | Fundamento de la prioridad: ____\nORDEN DE ATENCIÓN Y REFLEXIÓN FINAL\nOrden propuesto (y cómo resolviste empates):\nComparación justificada de dos riesgos (6–8 líneas):\nUn supuesto que podría alterar la prioridad:\nQué dato o evidencia verificarías antes de decidir:\nEVIDENCIA DE ENTREGA\nEntrega este mismo Google Doc individual completado, con las tres fichas, matriz consolidada, orden argumentado y comparación. No se requiere una captura de pantalla ni documento adicional.\nCRITERIOS DE EVALUACIÓN (100 PUNTOS)\nFormulación consistente de tres riesgos y activos: 20.\nClasificación por origen, activo y naturaleza con justificación: 20.\nProbabilidad e impacto sustentados, escala consistente e incertidumbre identificada: 25.\nMatriz y prioridad aplicada conforme a regla explícita, con justificación: 20.\nTratamiento/seguimiento, evidencia y comparación razonada: 15.\nCONTINUIDAD\nPara el tema 2.5 se distinguirán incidente, conducta riesgosa y posible delito informático. Una prioridad ALTA o un incidente técnico no demuestran por sí mismos la existencia de un delito."}]'
