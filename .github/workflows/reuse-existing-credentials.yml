name: Reuse Existing Apps Script Credentials

on:
  push:
    branches: [main]
    paths:
      - '.credential-reuse/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test existing credential combinations and create quiz
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          node <<'NODE'
          const deployment='AKfycbwvhillpOawsMRFwVjRx4iiO4IbVZcTgFE8-ZXvesVlwEhtrooqmS-8DQ2huxKWp3e6';
          const cfg=JSON.parse(process.env.CLASPRC_JSON||'{}');
          const t=(cfg.tokens && (cfg.tokens.default || Object.values(cfg.tokens)[0])) || {};
          const clasp={
            client_id:t.client_id||'',
            client_secret:t.client_secret||'',
            refresh_token:t.refresh_token||''
          };
          const dedicated={
            client_id:process.env.GOOGLE_OAUTH_CLIENT_ID||'',
            client_secret:process.env.GOOGLE_OAUTH_CLIENT_SECRET||'',
            refresh_token:process.env.GOOGLE_OAUTH_REFRESH_TOKEN||''
          };

          async function refresh(c){
            const body=new URLSearchParams({
              client_id:c.client_id,
              client_secret:c.client_secret,
              refresh_token:c.refresh_token,
              grant_type:'refresh_token'
            });
            const r=await fetch('https://oauth2.googleapis.com/token',{
              method:'POST',
              headers:{'content-type':'application/x-www-form-urlencoded'},
              body
            });
            let j={}; try{j=await r.json();}catch{}
            return {ok:r.ok,status:r.status,access_token:j.access_token||'',error:j.error||'',description:j.error_description||''};
          }
          async function run(accessToken,fn,parameters=[]){
            const r=await fetch('https://script.googleapis.com/v1/scripts/'+deployment+':run',{
              method:'POST',
              headers:{authorization:'Bearer '+accessToken,'content-type':'application/json'},
              body:JSON.stringify({function:fn,parameters})
            });
            let j={}; try{j=await r.json();}catch{}
            return {ok:r.ok,status:r.status,json:j};
          }

          const combos=[
            ['clasp',clasp],
            ['dedicated',dedicated],
            ['clasp-client+dedicated-refresh',{client_id:clasp.client_id,client_secret:clasp.client_secret,refresh_token:dedicated.refresh_token}],
            ['dedicated-client+clasp-refresh',{client_id:dedicated.client_id,client_secret:dedicated.client_secret,refresh_token:clasp.refresh_token}]
          ];

          for(const [name,c] of combos){
            if(!c.client_id||!c.client_secret||!c.refresh_token){console.log(name+': missing existing component');continue;}
            const tok=await refresh(c);
            console.log(name+': token '+tok.status+(tok.error?' '+tok.error:''));
            if(!tok.ok) continue;
            const diag=await run(tok.access_token,'diagnosticarInfraestructuraEjecucion',[]);
            const apiErr=diag.json?.error?.status||diag.json?.error?.message||diag.json?.error?.details?.[0]?.errorMessage||'';
            console.log(name+': scripts.run '+diag.status+(apiErr?' '+String(apiErr).slice(0,180):''));
            if(!diag.ok || diag.json?.error) continue;

            const quiz=await run(tok.access_token,'crearQuizAsistencia',[{
              courseId:'875776451793',
              requestId:'quiz-asistencia-so-reuse-existing-20260929'
            }]);
            if(!quiz.ok || quiz.json?.error){
              const e=quiz.json?.error?.status||quiz.json?.error?.message||quiz.json?.error?.details?.[0]?.errorMessage||'UNKNOWN';
              console.log(name+': quiz failed '+quiz.status+' '+String(e).slice(0,240));
              continue;
            }
            console.log('QUIZ_RESULT='+JSON.stringify(quiz.json.response?.result||null));
            process.exit(0);
          }
          process.exit(2);
          NODE
