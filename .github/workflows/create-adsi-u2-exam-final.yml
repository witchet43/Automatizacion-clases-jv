name: Create ADSI Unit 2 Exam Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-adsi-u2-exam-final.yml'

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Restore Google OAuth credentials
        shell: bash
        run: |
          printf '%s' '${{ secrets.CLASPRC_JSON }}' > .clasprc.json
          chmod 600 .clasprc.json

      - name: Create final Unit 2 exam in Forms + Classroom + audit sheets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const COURSE_ID='871158479566';
          const TOPIC_ID='886671819901';
          const OLD_WORK_ID='889508620258';
          const AUDIT_SHEET_ID='1YLSPcDSpqvaAk7lLeL6O3CTcgeqdrBtmxCgmdF6ISeA';
          const TITLE='Examen Unidad 2 - Tipología de Sistemas de Información';
          const DESCRIPTION='Examen individual y autocalificable de la Unidad 2. Responde utilizando la misma cuenta de Google con la que estás registrado en Classroom. Lee cuidadosamente cada caso: varias opciones son deliberadamente cercanas y debes seleccionar la más rigurosa. En preguntas de varias respuestas, selecciona exactamente la cantidad indicada. El examen contiene 25 reactivos, suma 100 puntos y está basado exclusivamente en las presentaciones 2.1, 2.2, 2.3 y 2.4. Las respuestas correctas, claves y retroalimentación no deben mostrarse al finalizar.';

          const qs=[
            {type:'CHECKBOX',q:'Un sistema universitario registra incidencias individuales, genera tendencias semanales y alimenta un análisis semestral de inversión. ¿Cuáles tres afirmaciones describen con mayor rigor su clasificación multidimensional? Selecciona exactamente tres.',o:['El registro de incidencias sustenta un uso operacional.','Las tendencias semanales pueden sustentar un uso táctico.','El análisis semestral de inversión puede sustentar un uso estratégico.','Debe elegirse un único nivel porque un SI no puede apoyar decisiones distintas.','La tecnología usada determina cuál de los tres niveles prevalece.'],a:[0,1,2]},
            {type:'MULTIPLE_CHOICE',q:'Un director general autoriza personalmente una devolución excepcional de caja usando un tablero en tiempo real. ¿Cuál clasificación pesa más para esa decisión concreta?',o:['Estratégica, porque decide un director general.','Táctica, porque usa un tablero.','Operacional, porque resuelve una transacción concreta e inmediata.','Estratégica, porque una excepción siempre implica incertidumbre alta.'],a:[2]},
            {type:'CHECKBOX',q:'Un gerente regional compara cuatro semanas de ventas por sucursal y reasigna inventario y turnos. ¿Qué tres rasgos justifican mejor clasificar esa decisión como táctica? Selecciona exactamente tres.',o:['Trabaja con agregados de varias semanas.','Busca desviaciones y excepciones respecto a metas.','Ajusta recursos en un horizonte de semanas o meses.','Utiliza necesariamente datos externos de mercado.','Su decisión es estructurada y registro a registro.'],a:[0,1,2]},
            {type:'MULTIPLE_CHOICE',q:'Una plataforma ya opera en un laboratorio y existe un plan aprobado para integrarla después con otros campus. ¿Qué alcance debe usarse para clasificarla hoy?',o:['Organizacional, porque la expansión ya está planeada.','Interorganizacional, porque habrá integración futura.','El alcance efectivamente implementado en el laboratorio actual.','El de mayor impacto potencial para no subestimar el sistema.'],a:[2]},
            {type:'CHECKBOX',q:'Para clasificar un SI por usuarios, ¿cuáles tres evidencias son más pertinentes que el nombre del departamento propietario? Selecciona exactamente tres.',o:['Responsabilidades concretas de cada rol.','Información que cada actor genera.','Información que cada actor consume o valida.','Lenguaje de programación de la aplicación.','Ubicación física del servidor.'],a:[0,1,2]},
            {type:'CHECKBOX',q:'Al analizar el tipo de decisión apoyada, ¿cuáles cuatro componentes deben documentarse según 2.1? Selecciona exactamente cuatro.',o:['Necesidad de información.','Evento detonador.','Usuario decisor y su autoridad.','Consecuencia de la decisión.','Tecnología preferida por el equipo.','Departamento que compró el software.'],a:[0,1,2,3]},
            {type:'MULTIPLE_CHOICE',q:'Un mismo módulo registra ventas individuales y también entrega un resumen de 30 días al jefe de tienda. ¿Cuál afirmación es la más rigurosa?',o:['El módulo es exclusivamente operacional porque captura transacciones.','El módulo es exclusivamente táctico porque produce reportes.','Puede apoyar decisiones operacionales y tácticas; cada clasificación debe justificarse por uso, horizonte y datos.','Debe clasificarse por el puesto del usuario que tenga mayor jerarquía.'],a:[2]},
            {type:'CHECKBOX',q:'En una matriz de clasificación, ¿cuáles tres elementos permiten sostener una categoría sin convertirla en una etiqueta arbitraria? Selecciona exactamente tres.',o:['Evidencia documental.','Alternativa complementaria que también podría justificarse.','Supuesto explícito cuando falta información.','Preferencia tecnológica del analista.','Importancia percibida del sistema.'],a:[0,1,2]},
            {type:'MULTIPLE_CHOICE',q:'Un reporte se genera todos los días, compara acumulados de las últimas seis semanas y se usa para ajustar metas mensuales. ¿Qué nivel predomina?',o:['Operacional, porque la frecuencia es diaria.','Táctico, porque analiza tendencia y ajusta recursos/metas en semanas o meses.','Estratégico, porque contiene información histórica.','Operacional, porque toda información interna es operacional.'],a:[1]},
            {type:'CHECKBOX',q:'¿Qué tres asociaciones nivel–característica son las más precisas según 2.2? Selecciona exactamente tres.',o:['Operacional → máxima granularidad y decisiones estructuradas.','Táctico → agregados de corto/mediano plazo y decisiones semi-estructuradas.','Estratégico → datos internos y externos, horizonte amplio e incertidumbre alta.','Estratégico → frecuencia continua y detalle registro a registro.','Táctico → exclusivamente datos externos y horizonte de años.'],a:[0,1,2]},
            {type:'MULTIPLE_CHOICE',q:'La misma pantalla muestra ventas en tiempo real. Un cajero la usa para confirmar una transacción y el jefe de tienda para evaluar el desempeño del turno. ¿Qué cambia entre ambos usos?',o:['La tecnología del sistema.','El nivel decisional sustentado por la decisión que se toma.','La frontera del sistema.','La función de negocio propietaria del software.'],a:[1]},
            {type:'CHECKBOX',q:'Respecto al flujo de datos entre niveles, ¿cuáles tres afirmaciones son correctas? Selecciona exactamente tres.',o:['La calidad de datos operacionales condiciona la confiabilidad del análisis táctico.','Los retrasos de consolidación pueden limitar la oportunidad del análisis estratégico.','La estrategia puede redefinir qué datos deben capturarse operacionalmente.','Los niveles son independientes; la información no debe retroalimentarse.','Los datos estratégicos siempre sustituyen a los operacionales.'],a:[0,1,2]},
            {type:'MULTIPLE_CHOICE',q:'En la jerarquía función → proceso → actividad → tarea, ¿en qué nivel recomienda 2.3 construir la matriz IPO?',o:['Solo en función, porque es el nivel más amplio.','Proceso o actividad, porque permiten analizar transformaciones sin caer en pasos atómicos.','Tarea exclusivamente, porque es el único nivel ejecutable.','Cualquier nivel; la distinción no afecta el análisis.'],a:[1]},
            {type:'CHECKBOX',q:'¿Cuáles cuatro pueden constituir entradas informacionales de un proceso? Selecciona exactamente cuatro.',o:['Dato.','Documento.','Evento.','Solicitud.','Resultado producido por el proceso.','Decisión final del consumidor.'],a:[0,1,2,3]},
            {type:'MULTIPLE_CHOICE',q:'Un equipo describe el procesamiento de crédito únicamente como “analizar datos”. ¿Cuál es la crítica más precisa?',o:['Es suficiente si el sistema es táctico.','Describe una actividad tecnológica, pero no una transformación verificable ni una regla de negocio.','Es correcto siempre que la entrada sea completa.','Solo falta identificar el usuario, no la regla.'],a:[1]},
            {type:'CHECKBOX',q:'Una salida de calidad dentro de una matriz IPO debe cumplir al menos con estas tres condiciones. Selecciona exactamente tres.',o:['Ser producto del procesamiento y no una actividad.','Tener un consumidor identificado.','Apoyar una decisión o propósito concreto.','Usar necesariamente un formato PDF.','Ser siempre un reporte agregado.'],a:[0,1,2]},
            {type:'MULTIPLE_CHOICE',q:'Un ticket individual de venta se agrega por semana y se convierte en entrada de un análisis de desempeño. ¿Qué demuestra este caso?',o:['Que un dato solo puede pertenecer a un nivel organizacional.','Que el mismo dato puede cambiar de papel al agregarse y alimentar otro nivel decisional.','Que toda agregación vuelve estratégica la información.','Que las entradas tácticas deben provenir de fuentes externas.'],a:[1]},
            {type:'CHECKBOX',q:'En la cadena de trazabilidad IPO, ¿cuáles cuatro relaciones deben poder seguirse sin ruptura? Selecciona exactamente cuatro.',o:['Función → entrada.','Entrada → regla/proceso.','Regla/proceso → salida.','Salida → consumidor/decisión.','Tecnología → presupuesto.','Interfaz → lenguaje de programación.'],a:[0,1,2,3]},
            {type:'MULTIPLE_CHOICE',q:'¿Cuál opción está formulada correctamente como salida y no como actividad?',o:['Registrar pedido.','Validar solicitud.','Pedido registrado y confirmado al cliente.','Analizar datos de inventario.'],a:[2]},
            {type:'CHECKBOX',q:'¿Cuáles cinco criterios de calidad mínima de entradas y salidas aparecen en 2.3? Selecciona exactamente cinco.',o:['Precisión.','Oportunidad.','Completitud.','Pertinencia.','Verificabilidad.','Popularidad.','Complejidad técnica.'],a:[0,1,2,3,4]},
            {type:'MULTIPLE_CHOICE',q:'El sistema solicita a una pasarela bancaria que procese un pago y después recibe una confirmación. ¿Cuál modelado es correcto?',o:['La pasarela debe estar dentro de la frontera porque el sistema la invoca.','Procesar el pago es una capacidad interna porque el usuario lo inició desde el sistema.','La pasarela es un sistema externo; la solicitud y la confirmación son flujos que cruzan la frontera.','La pasarela queda fuera del alcance y por eso no debe aparecer en el diagrama.'],a:[2]},
            {type:'CHECKBOX',q:'¿Cuáles tres afirmaciones distinguen correctamente “dentro del alcance”, “fuera del sistema” y “fuera del alcance”? Selecciona exactamente tres.',o:['Dentro del alcance: funciones que esta versión incluye y automatiza.','Fuera del sistema: actores o sistemas que interactúan pero no forman parte del sistema analizado.','Fuera del alcance: funciones excluidas explícitamente de esta versión.','Fuera del sistema y fuera del alcance significan exactamente lo mismo.','Un actor externo debe colocarse dentro de la frontera si usa la aplicación diariamente.'],a:[0,1,2]},
            {type:'MULTIPLE_CHOICE',q:'Un estudiante captura una solicitud directamente en la aplicación. ¿Dónde debe colocarse en el diagrama de contexto?',o:['Dentro de la frontera porque captura datos.','Fuera de la frontera como actor que intercambia información con el sistema.','Dentro de la frontera únicamente si está autenticado.','Fuera del alcance porque no es software.'],a:[1]},
            {type:'CHECKBOX',q:'Un diagrama de contexto muestra una pasarela de pago externa. ¿Cuáles tres prácticas hacen que el modelo sea verificable? Selecciona exactamente tres.',o:['Mantener la pasarela fuera de la frontera.','Nombrar flujos concretos como “solicitud de cobro” y “confirmación de pago”.','Distinguir la responsabilidad externa de procesar el pago de la capacidad interna de solicitarlo/registrar el resultado.','Dibujar una flecha sin etiqueta para evitar sobreespecificación.','Representar a la pasarela como módulo interno para simplificar.'],a:[0,1,2]},
            {type:'MULTIPLE_CHOICE',q:'Un sistema recibe solicitudes de usuarios operativos, aplica reglas rutinarias, registra transacciones y devuelve confirmaciones. El diagrama no muestra análisis histórico agregado, modelos de decisión ni usuarios tácticos. ¿Cuál justificación final es la más sólida?',o:['DSS, porque cualquier sistema ayuda a tomar decisiones.','Estratégico, porque automatiza una función importante.','TPS/operacional, porque la frontera y los flujos evidencian transacciones estructuradas; un DSS sería una alternativa no sustentada por el modelo actual.','Táctico, porque toda salida puede convertirse después en un reporte.'],a:[2]}
          ];

          if(qs.length!==25) throw new Error('Expected 25 questions');
          for(const q of qs) if(q.a.some(i=>i<0||i>=q.o.length)) throw new Error('Bad answer index');

          const creds=JSON.parse(fs.readFileSync('.clasprc.json','utf8'));
          const found=[];
          function walk(v){ if(!v||typeof v!=='object')return; if(v.refresh_token&&v.client_id&&v.client_secret)found.push(v); for(const x of Object.values(v))walk(x); }
          walk(creds);
          if(!found.length) throw new Error('No OAuth refresh credentials found');
          const c=found[0];
          const tr=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:c.client_id,client_secret:c.client_secret,refresh_token:c.refresh_token,grant_type:'refresh_token'})});
          if(!tr.ok) throw new Error('OAuth refresh failed '+tr.status+' '+await tr.text());
          const token=(await tr.json()).access_token;
          const H={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          async function api(url,opts={}){
            const r=await fetch(url,{...opts,headers:{...H,...(opts.headers||{})}});
            const txt=await r.text();
            if(!r.ok) throw new Error((opts.method||'GET')+' '+url+' -> '+r.status+' '+txt.slice(0,1200));
            return txt?JSON.parse(txt):{};
          }

          // Remove obsolete DRAFT only if still present.
          try{
            const old=await api('https://classroom.googleapis.com/v1/courses/'+COURSE_ID+'/courseWork/'+OLD_WORK_ID);
            if(old.courseWorkState==='DRAFT'||old.state==='DRAFT'){
              await api('https://classroom.googleapis.com/v1/courses/'+COURSE_ID+'/courseWork/'+OLD_WORK_ID,{method:'DELETE'});
              console.log('Deleted obsolete DRAFT '+OLD_WORK_ID);
            } else {
              console.log('Old work not deleted because state='+String(old.courseWorkState||old.state||''));
            }
          }catch(e){ console.log('Old work cleanup skipped: '+e.message.slice(0,400)); }

          const created=await api('https://forms.googleapis.com/v1/forms',{method:'POST',body:JSON.stringify({info:{title:TITLE,documentTitle:TITLE}})});
          const formId=created.formId;
          const requests=[
            {updateSettings:{settings:{quizSettings:{isQuiz:true}},updateMask:'quizSettings.isQuiz'}},
            {updateFormInfo:{info:{description:DESCRIPTION},updateMask:'description'}}
          ];
          qs.forEach((q,idx)=>{
            const options=q.o.map(v=>({value:v}));
            const correctAnswers={answers:q.a.map(i=>({value:q.o[i]}))};
            requests.push({createItem:{location:{index:idx},item:{title:q.q,questionItem:{question:{required:true,grading:{pointValue:4,correctAnswers},choiceQuestion:{type:q.type,options,shuffle:false}}}}}});
          });
          await api('https://forms.googleapis.com/v1/forms/'+formId+':batchUpdate',{method:'POST',body:JSON.stringify({requests})});

          const form=await api('https://forms.googleapis.com/v1/forms/'+formId);
          const responderUri=form.responderUri;
          if(!responderUri) throw new Error('No responderUri returned');

          // Try to require verified email; if API field is unsupported, keep exam creation valid and report it.
          try{
            await api('https://forms.googleapis.com/v1/forms/'+formId+':batchUpdate',{method:'POST',body:JSON.stringify({requests:[{updateSettings:{settings:{emailCollectionType:'VERIFIED'},updateMask:'emailCollectionType'}}]})});
            console.log('Verified email collection enabled');
          }catch(e){
            console.log('Verified email collection setting not supported by current Forms API: '+e.message.slice(0,400));
          }

          const cw=await api('https://classroom.googleapis.com/v1/courses/'+COURSE_ID+'/courseWork',{method:'POST',body:JSON.stringify({
            title:TITLE,
            description:DESCRIPTION+'\n\nImportante: responde usando la misma cuenta y correo con los que estás registrado en Google Classroom.',
            workType:'ASSIGNMENT',
            state:'DRAFT',
            maxPoints:100,
            topicId:TOPIC_ID,
            materials:[{link:{url:responderUri,title:TITLE}}]
          })});
          const workId=cw.id;
          if(!workId) throw new Error('No Classroom workId returned');

          const quizId='EXAM-20261013-ADSC-U2-FINAL';
          const now=new Date().toISOString();

          // Read headers and append audit row.
          async function valuesGet(range){
            return api('https://sheets.googleapis.com/v4/spreadsheets/'+AUDIT_SHEET_ID+'/values/'+encodeURIComponent(range));
          }
          async function append(range,values){
            return api('https://sheets.googleapis.com/v4/spreadsheets/'+AUDIT_SHEET_ID+'/values/'+encodeURIComponent(range)+':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS',{method:'POST',body:JSON.stringify({values})});
          }
          const qh=(await valuesGet('Quizzes!A1:W1')).values?.[0]||[];
          const qdata={
            'Quiz ID':quizId,'ID del curso':COURSE_ID,'Nombre del curso':'UAQ - Análisis y Diseño de Sistemas Computacionales',
            'Unidad / tema':'Unidad 2','ID del tema':TOPIC_ID,'Título':TITLE,'Instrucciones':DESCRIPTION,'Puntos totales':100,
            'Estado':'CREADA','Recopilar correo':'SÍ','Limitar a 1 respuesta':'SÍ','Barajar preguntas':'NO','ID del Form':formId,
            'URL edición Form':'https://docs.google.com/forms/d/'+formId+'/edit','URL responder Form':responderUri,'ID actividad Classroom':workId,
            'URL actividad Classroom':'','Fecha creación':now,'Última actualización':now,
            'Resultado / error':'CREADA por GitHub Actions como DRAFT; 25 reactivos / 100 puntos; basada en Gamma 2.1–2.4; dificultad alta.',
            'Tipo instrumento':'EXAMEN','Política retroalimentación':'SIN_RETROALIMENTACION'
          };
          await append('Quizzes!A:W',[qh.map(h=>qdata[h]??'')]);

          const ph=(await valuesGet("'Preguntas Quiz'!A1:T1")).values?.[0]||[];
          const letters='ABCDEFGH';
          const rows=qs.map((q,idx)=>{
            const d={
              'Quiz ID':quizId,'ID del curso':COURSE_ID,'Orden':idx+1,'Tipo':q.type==='CHECKBOX'?'casillas':'opción múltiple',
              'Pregunta':q.q,'Respuesta correcta':q.a.map(i=>letters[i]).join(','),'Puntos':4,'Obligatoria':'SÍ'
            };
            q.o.forEach((opt,i)=>{d['Opción '+letters[i]]=opt;});
            return ph.map(h=>d[h]??'');
          });
          await append("'Preguntas Quiz'!A:T",rows);

          const verify=await api('https://classroom.googleapis.com/v1/courses/'+COURSE_ID+'/courseWork/'+workId);
          const verifyForm=await api('https://forms.googleapis.com/v1/forms/'+formId);
          const itemCount=(verifyForm.items||[]).filter(x=>x.questionItem).length;
          if(String(verify.state||verify.courseWorkState)!=='DRAFT') throw new Error('Classroom postflight not DRAFT');
          if(itemCount!==25) throw new Error('Form postflight itemCount='+itemCount);

          console.log(JSON.stringify({ok:true,title:TITLE,quizId,formId,formEditUrl:'https://docs.google.com/forms/d/'+formId+'/edit',responderUri,workId,state:String(verify.state||verify.courseWorkState),points:verify.maxPoints,itemCount}));
          NODE
