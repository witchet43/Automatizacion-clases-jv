name: Deploy Independent Academic MCP to Cloud Run
on:
  push:
    branches: [main]
    paths:
      - 'mcp-cloud-run/**'
      - '.github/workflows/deploy-cloud-run-mcp.yml'
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Deploy the anonymous academic MCP with synchronized context'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
concurrency:
  group: academic-mcp-cloudrun-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce authorized platform change on push
        if: github.event_name == 'push'
        run: node scripts/assert-platform-change-authorized.mjs
      - name: Synchronize canonical Apps Script context
        run: node mcp-cloud-run/sync-context.mjs
      - name: Test MCP without external Classroom calls
        working-directory: mcp-cloud-run
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Authenticate with existing GitHub Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Require existing HMAC Secret Manager version (metadata only)
        shell: bash
        run: |
          set -euo pipefail
          state="$(gcloud secrets versions describe latest --secret academic-write-hmac --project classroom-mcp-512122 --format='value(state)')"
          if [[ "$state" != ENABLED ]]; then
            echo "::error::Missing enabled academic-write-hmac"; exit 1
          fi
      - name: Require GitHub App configuration for deploy diagnostics
        env:
          GITHUB_APP_ID: ${{ vars.ACADEMIC_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ vars.ACADEMIC_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_APP_ID" =~ ^[0-9]+$ ]] || { echo "::error::GITHUB_APP_ID variable required"; exit 1; }
          [[ "$GITHUB_APP_INSTALLATION_ID" =~ ^[0-9]+$ ]] || { echo "::error::GITHUB_APP_INSTALLATION_ID variable required"; exit 1; }
          state="$(gcloud secrets versions describe latest --secret academic-github-app-key --project classroom-mcp-512122 --format='value(state)')"
          [[ "$state" == ENABLED ]] || { echo "::error::academic-github-app-key secret unavailable"; exit 1; }
      - name: Deploy only new independent MCP adapter
        env:
          PROJECT: classroom-mcp-512122
          REGION: us-central1
          RUNTIME_SA: classroom-mcp-sa@classroom-mcp-512122.iam.gserviceaccount.com
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=academic-classroom-mcp-oauth
          # Reuse the already planned dedicated service name. Never touch the two legacy services.
          # Canonical deployed host reported by gcloud run deploy on 2026-10-26.
          # The legacy status.url alias returned 404; do not use it for health checks.
          URL="https://academic-classroom-mcp-oauth-148028894895.us-central1.run.app"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --source ./mcp-cloud-run --service-account "$RUNTIME_SA" \
            --labels "github-commit=${{ github.sha }}" \
            --build-service-account "projects/$PROJECT/serviceAccounts/$RUNTIME_SA" \
            --allow-unauthenticated --ingress all \
            --min-instances=0 --memory=512Mi --timeout=300 \
            --set-env-vars "MCP_AUTH_MODE=anonymous,MCP_PUBLIC_URL=$URL,MCP_DEPLOY_COMMIT=${{ github.sha }},GITHUB_APP_ID=${{ vars.ACADEMIC_APP_ID }},GITHUB_APP_INSTALLATION_ID=${{ vars.ACADEMIC_APP_INSTALLATION_ID }}" \
            --set-secrets "ACADEMIC_WRITE_HMAC_KEY=academic-write-hmac:latest,GITHUB_APP_PRIVATE_KEY=academic-github-app-key:latest" \
            --quiet
          REAL_URL="$URL"
          [[ "$REAL_URL" == https://* ]] || { echo "::error::Missing public Cloud Run HTTPS URL"; exit 1; }
          echo "MCP_ENDPOINT=$REAL_URL/mcp" >> "$GITHUB_ENV"
          {
            echo '## Classroom Academic Gateway — anonymous MCP'
            echo "Endpoint: $REAL_URL/mcp"
            echo 'MCP_AUTH_MODE=anonymous (user requested).'
            echo 'Only the runtime can access Secret Manager HMAC; requests are signed to canonical WebApp.'
            echo 'Academic mutations use the existing canonical signed WebApp workflow.'
            echo 'Deployment performs no Classroom grade mutation.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify live anonymous MCP and gateway_status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json
          url='https://academic-classroom-mcp-oauth-148028894895.us-central1.run.app'
          with urllib.request.urlopen(url+'/health',timeout=30) as r:
              d=json.load(r)
              print('HEALTH',d)
              assert d['status']=='ok' and d['auth']=='anonymous'
          for method,params in [('tools/list',{}),('tools/call',{'name':'gateway_status','arguments':{}})]:
              data=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              req=urllib.request.Request(url+'/mcp',data=data,headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream','MCP-Protocol-Version':'2025-03-26'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read().decode()
                  print(method,body[:5000])
                  assert r.status==200 and '"error"' not in body
                  if method=='tools/list':
                      assert 'gateway_status' in body and 'listar_entregas' in body
          PY
