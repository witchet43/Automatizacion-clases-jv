name: Deploy Independent Academic MCP to Cloud Run
on:
  push:
    branches: [main]
    paths:
      - 'mcp-cloud-run/**'
      - '.github/workflows/deploy-cloud-run-mcp.yml'
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Deploy the authenticated academic MCP (OAuth required)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
concurrency:
  group: academic-mcp-cloudrun-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce authorized platform change on push
        if: github.event_name == 'push'
        run: node scripts/assert-platform-change-authorized.mjs
      - name: Synchronize canonical Apps Script context
        run: node mcp-cloud-run/sync-context.mjs
      - name: Test MCP without external Classroom calls
        working-directory: mcp-cloud-run
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Authenticate with existing GitHub Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Require existing HMAC Secret Manager version (metadata only)
        shell: bash
        run: |
          set -euo pipefail
          state="$(gcloud secrets versions describe latest --secret academic-write-hmac --project classroom-mcp-512122 --format='value(state)')"
          if [[ "$state" != ENABLED ]]; then
            echo "::error::Missing enabled academic-write-hmac"; exit 1
          fi
      - name: Require verified OAuth configuration and subject allowlist
        env:
          MCP_OAUTH_ISSUER: ${{ vars.MCP_OAUTH_ISSUER }}
          MCP_OAUTH_JWKS_URL: ${{ vars.MCP_OAUTH_JWKS_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MCP_OAUTH_ISSUER" == https://* ]] || { echo "::error::MCP_OAUTH_ISSUER is missing or not HTTPS"; exit 1; }
          [[ "$MCP_OAUTH_JWKS_URL" == https://* ]] || { echo "::error::MCP_OAUTH_JWKS_URL is missing or not HTTPS"; exit 1; }
          state="$(gcloud secrets versions describe latest --secret academic-mcp-allowed-subjects --project classroom-mcp-512122 --format='value(state)')"
          [[ "$state" == ENABLED ]] || { echo "::error::OAuth subject allowlist is missing"; exit 1; }
          MCP_OAUTH_ISSUER="$MCP_OAUTH_ISSUER" MCP_OAUTH_JWKS_URL="$MCP_OAUTH_JWKS_URL" node scripts/verify-auth0-mcp.mjs
      - name: Grant existing runtime identity Cloud Run read-only visibility
        shell: bash
        run: |
          set -euo pipefail
          gcloud projects add-iam-policy-binding classroom-mcp-512122 \
            --member="serviceAccount:classroom-mcp-sa@classroom-mcp-512122.iam.gserviceaccount.com" \
            --role="roles/run.viewer" --condition=None --quiet
      - name: Require GitHub App configuration for deploy diagnostics
        env:
          GITHUB_APP_ID: ${{ vars.GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ vars.GITHUB_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_APP_ID" =~ ^[0-9]+$ ]] || { echo "::error::GITHUB_APP_ID variable required"; exit 1; }
          [[ "$GITHUB_APP_INSTALLATION_ID" =~ ^[0-9]+$ ]] || { echo "::error::GITHUB_APP_INSTALLATION_ID variable required"; exit 1; }
          state="$(gcloud secrets versions describe latest --secret academic-github-app-key --project classroom-mcp-512122 --format='value(state)')"
          [[ "$state" == ENABLED ]] || { echo "::error::academic-github-app-key secret unavailable"; exit 1; }
      - name: Deploy only new independent MCP adapter
        env:
          PROJECT: classroom-mcp-512122
          REGION: us-central1
          RUNTIME_SA: classroom-mcp-sa@classroom-mcp-512122.iam.gserviceaccount.com
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=academic-classroom-mcp-oauth
          # Reuse the already planned dedicated service name. Never touch the two legacy services.
          # Canonical deployed host reported by gcloud run deploy on 2026-10-26.
          # The legacy status.url alias returned 404; do not use it for health checks.
          URL="https://academic-classroom-mcp-oauth-148028894895.us-central1.run.app"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --source ./mcp-cloud-run --service-account "$RUNTIME_SA" \
            --labels "github-commit=${{ github.sha }}" \
            --build-service-account "projects/$PROJECT/serviceAccounts/$RUNTIME_SA" \
            --allow-unauthenticated --ingress all \
            --min-instances=0 --memory=512Mi --timeout=300 \
            --set-env-vars "MCP_AUTH_MODE=oauth,MCP_PUBLIC_URL=$URL,MCP_OAUTH_ISSUER=${{ vars.MCP_OAUTH_ISSUER }},MCP_OAUTH_JWKS_URL=${{ vars.MCP_OAUTH_JWKS_URL }},MCP_DEPLOY_COMMIT=${{ github.sha }},GITHUB_APP_ID=${{ vars.GITHUB_APP_ID }},GITHUB_APP_INSTALLATION_ID=${{ vars.GITHUB_APP_INSTALLATION_ID }}" \
            --set-secrets "ACADEMIC_WRITE_HMAC_KEY=academic-write-hmac:latest,MCP_ALLOWED_SUBJECTS=academic-mcp-allowed-subjects:latest,GITHUB_APP_PRIVATE_KEY=academic-github-app-key:latest" \
            --quiet
          REAL_URL="$URL"
          [[ "$REAL_URL" == https://* ]] || { echo "::error::Missing public Cloud Run HTTPS URL"; exit 1; }
          echo "MCP_ENDPOINT=$REAL_URL/mcp" >> "$GITHUB_ENV"
          {
            echo '## Classroom Academic Gateway — authenticated MCP'
            echo "Endpoint: $REAL_URL/mcp"
            echo 'Cloud Run ingress is public but academic requests require verified OAuth bearer tokens.'
            echo 'Only the runtime can access Secret Manager HMAC; requests are signed to canonical WebApp.'
            echo 'Academic writes require verified OAuth subject, scope and explicit confirmation.'
            echo 'Deployment performs no Classroom grade mutation.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify live OAuth health and reject anonymous MCP invocation
        shell: bash
        run: |
          set -euo pipefail
          BASE="${MCP_ENDPOINT%/mcp}"
          # Diagnose the public endpoint using metadata only; never read HMAC or grades.
          gcloud run services describe academic-classroom-mcp-oauth \
            --project classroom-mcp-512122 --region us-central1 --format=json |
            jq '{service:.metadata.name,ingress:.metadata.annotations["run.googleapis.com/ingress"],defaultUrlDisabled:.metadata.annotations["run.googleapis.com/default-url-disabled"],statusUrl:.status.url,ready:.status.conditions[-1].status}'
          status="$(curl --silent --show-error --max-time 30 -o /tmp/mcp-health-body -D /tmp/mcp-health-headers -w '%{http_code}' "$BASE/health")"
          head -n 16 /tmp/mcp-health-headers
          if [[ "$status" != 200 ]]; then
            echo "Cloud Run health HTTP status: $status"
            head -c 700 /tmp/mcp-health-body
            exit 1
          fi
          python3 -c 'import json; d=json.load(open("/tmp/mcp-health-body")); assert d["status"]=="ok" and d["auth"]=="oauth"'
          code="$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' "$MCP_ENDPOINT" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-healthcheck","version":"1"}}}')"
          [[ "$code" == 401 ]] || { echo "::error::Anonymous MCP handshake must return 401 (got $code)"; exit 1; }
