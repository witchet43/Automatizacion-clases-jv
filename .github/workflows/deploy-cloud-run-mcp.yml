name: Deploy Independent Academic MCP to Cloud Run
on:
  push:
    branches: [main]
    paths:
      - 'mcp-cloud-run/**'
      # README and Markdown guides are not container source changes.
      - '!mcp-cloud-run/**/*.md'
      - '.github/workflows/deploy-cloud-run-mcp.yml'
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Deploy the OAuth-protected academic MCP with synchronized context'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
concurrency:
  group: academic-mcp-cloudrun-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce authorized platform change on push
        if: github.event_name == 'push'
        run: node scripts/assert-platform-change-authorized.mjs
      - name: Synchronize canonical Apps Script context
        run: node mcp-cloud-run/sync-context.mjs
      - name: Test MCP without external Classroom calls
        working-directory: mcp-cloud-run
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Authenticate with existing GitHub Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Require existing HMAC Secret Manager version (metadata only)
        shell: bash
        run: |
          set -euo pipefail
          state="$(gcloud secrets versions describe latest --secret academic-write-hmac --project classroom-mcp-512122 --format='value(state)')"
          if [[ "$state" != ENABLED ]]; then
            echo "::error::Missing enabled academic-write-hmac"; exit 1
          fi
      - name: Validate Auth0 OAuth discovery, PKCE, and JWKS
        env:
          MCP_OAUTH_ISSUER: https://dev-67cfevmusm7px130.us.auth0.com/
          MCP_OAUTH_JWKS_URL: https://dev-67cfevmusm7px130.us.auth0.com/.well-known/jwks.json
        run: node scripts/verify-auth0-mcp.mjs
      - name: Require OAuth subject allowlist secret (metadata only)
        shell: bash
        run: |
          set -euo pipefail
          state="$(gcloud secrets versions describe latest --secret academic-mcp-allowed-subjects --project classroom-mcp-512122 --format='value(state)')"
          if [[ "$state" != ENABLED ]]; then
            echo "::error::Missing enabled OAuth subject allowlist"; exit 1
          fi
      - name: Deploy only new independent MCP adapter
        env:
          PROJECT: classroom-mcp-512122
          REGION: us-central1
          RUNTIME_SA: classroom-mcp-sa@classroom-mcp-512122.iam.gserviceaccount.com
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=academic-classroom-mcp-oauth
          # Reuse the already planned dedicated service name. Never touch the two legacy services.
          # Canonical deployed host reported by gcloud run deploy on 2026-10-26.
          # The legacy status.url alias returned 404; do not use it for health checks.
          URL="https://academic-classroom-mcp-oauth-148028894895.us-central1.run.app"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --source ./mcp-cloud-run --service-account "$RUNTIME_SA" \
            --labels "github-commit=${{ github.sha }}" \
            --build-service-account "projects/$PROJECT/serviceAccounts/$RUNTIME_SA" \
            --allow-unauthenticated --ingress all \
            --min-instances=0 --memory=512Mi --timeout=300 \
            --set-env-vars "MCP_AUTH_MODE=oauth,MCP_PUBLIC_URL=$URL,MCP_OAUTH_ISSUER=https://dev-67cfevmusm7px130.us.auth0.com/,MCP_OAUTH_JWKS_URL=https://dev-67cfevmusm7px130.us.auth0.com/.well-known/jwks.json,MCP_DEPLOY_COMMIT=${{ github.sha }}" \
            --set-secrets "ACADEMIC_WRITE_HMAC_KEY=academic-write-hmac:latest,MCP_ALLOWED_SUBJECTS=academic-mcp-allowed-subjects:latest" \
            --quiet
          REAL_URL="$URL"
          [[ "$REAL_URL" == https://* ]] || { echo "::error::Missing public Cloud Run HTTPS URL"; exit 1; }
          echo "MCP_ENDPOINT=$REAL_URL/mcp" >> "$GITHUB_ENV"
          {
            echo '## Classroom Academic Gateway — OAuth MCP'
            echo "Endpoint: $REAL_URL/mcp"
            echo 'MCP_AUTH_MODE=oauth; protected user-grading actions require academic.close_unit.'
            echo 'Only the runtime can access Secret Manager HMAC; requests are signed to canonical WebApp.'
            echo 'Academic mutations use the existing canonical signed WebApp workflow.'
            echo 'Deployment performs no Classroom grade mutation.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify live OAuth metadata and unauthenticated rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          base='https://academic-classroom-mcp-oauth-148028894895.us-central1.run.app'
          issuer='https://dev-67cfevmusm7px130.us.auth0.com/'
          with urllib.request.urlopen(base+'/health',timeout=30) as r:
              d=json.load(r)
              assert d['status']=='ok' and d['auth']=='oauth', d
          with urllib.request.urlopen(base+'/.well-known/oauth-protected-resource',timeout=30) as r:
              d=json.load(r)
              assert d['authorization_servers']==[issuer], d
              assert d['resource']==base, d
              assert 'academic.close_unit' in d['scopes_supported'], d
          data=json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/call','params':{'name':'cerrar_unidad','arguments':{'courseId':'871149624583','unidad':2,'confirmar':True}}}).encode()
          req=urllib.request.Request(base+'/mcp',data=data,headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream'},method='POST')
          try:
              urllib.request.urlopen(req,timeout=30)
              raise AssertionError('Anonymous grade closure was accepted')
          except urllib.error.HTTPError as e:
              assert e.code==401, e.code
              assert 'resource_metadata=' in e.headers.get('WWW-Authenticate','')
          print('OAUTH_DEPLOYMENT_VERIFIED; ANONYMOUS_GRADE_WRITE_DENIED')
          PY

      - name: Verify live MCP initialization, tools/list and gateway_status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json
          base='https://academic-classroom-mcp-oauth-148028894895.us-central1.run.app/mcp'
          def rpc(method, params, identifier):
              data=json.dumps({'jsonrpc':'2.0','id':identifier,'method':method,'params':params}).encode()
              req=urllib.request.Request(base,data=data,headers={
                  'Content-Type':'application/json',
                  'Accept':'application/json, text/event-stream'
              },method='POST')
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read().decode()
                  assert r.status==200, (method,r.status)
              events=[line[6:] for line in raw.splitlines() if line.startswith('data: ')]
              return json.loads(events[0] if events else raw)
          init=rpc('initialize',{'protocolVersion':'2025-06-18',
              'capabilities':{},'clientInfo':{'name':'github-live-probe','version':'1'}},1)
          assert init.get('result',{}).get('serverInfo',{}).get('name')=='classroom-academic-gateway',init
          listed=rpc('tools/list',{},2)
          tools={tool['name'] for tool in listed['result']['tools']}
          expected={'gateway_status','consultar_despliegues_mcp','consultar_ejecucion_mcp',
              'iniciar_despliegue_mcp','verificar_despliegue','diagnosticar_clase',
              'auditar_recursos','crear_recurso','listar_entregas','calificar_entrega_draft',
              'cerrar_materia','cerrar_unidad'}
          assert tools==expected,(tools^expected)
          result=rpc('tools/call',{'name':'gateway_status','arguments':{'verificarFirma':True}},3)['result']
          assert result.get('isError')!=True, result
          status=json.loads(result['content'][0]['text'])
          assert status['configured'] is True and status['writesThrough']=='SIGNED_WEBAPP_ONLY'
          assert status['upstreamHmacAccepted'] is True, status
          print('LIVE_MCP_TOOLS_DISCOVERY_AND_HMAC_VERIFIED: 12 tools and signed Apps Script challenge')
          PY
