name: Deploy Independent Academic MCP to Cloud Run
on:
  push:
    branches: [main]
    paths:
      - 'mcp-cloud-run/**'
      - '.github/workflows/deploy-cloud-run-mcp.yml'
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Deploy the anonymous academic MCP (no Auth0); publicly callable'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
concurrency:
  group: academic-mcp-cloudrun-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce authorized platform change on push
        if: github.event_name == 'push'
        run: node scripts/assert-platform-change-authorized.mjs
      - name: Synchronize canonical Apps Script context
        run: node mcp-cloud-run/sync-context.mjs
      - name: Test MCP without external Classroom calls
        working-directory: mcp-cloud-run
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Authenticate with existing GitHub Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Require existing HMAC Secret Manager version (metadata only)
        shell: bash
        run: |
          set -euo pipefail
          state="$(gcloud secrets versions describe latest --secret academic-write-hmac --project classroom-mcp-512122 --format='value(state)')"
          if [[ "$state" != ENABLED ]]; then
            echo "::error::Missing enabled academic-write-hmac"; exit 1
          fi
      - name: Deploy only new independent MCP adapter
        env:
          PROJECT: classroom-mcp-512122
          REGION: us-central1
          RUNTIME_SA: classroom-mcp-sa@classroom-mcp-512122.iam.gserviceaccount.com
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=academic-classroom-mcp-oauth
          # Reuse the already planned dedicated service name. Never touch the two legacy services.
          # Canonical deployed host reported by gcloud run deploy on 2026-10-26.
          # The legacy status.url alias returned 404; do not use it for health checks.
          URL="https://academic-classroom-mcp-oauth-148028894895.us-central1.run.app"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --source ./mcp-cloud-run --service-account "$RUNTIME_SA" \
            --build-service-account "projects/$PROJECT/serviceAccounts/$RUNTIME_SA" \
            --allow-unauthenticated --ingress all \
            --min-instances=0 --memory=512Mi --timeout=300 \
            --set-env-vars "MCP_AUTH_MODE=anonymous,MCP_PUBLIC_URL=$URL" \
            --set-secrets "ACADEMIC_WRITE_HMAC_KEY=academic-write-hmac:latest" \
            --quiet
          REAL_URL="$URL"
          [[ "$REAL_URL" == https://* ]] || { echo "::error::Missing public Cloud Run HTTPS URL"; exit 1; }
          echo "MCP_ENDPOINT=$REAL_URL/mcp" >> "$GITHUB_ENV"
          {
            echo '## Classroom Academic Gateway — anonymous MCP'
            echo "Endpoint: $REAL_URL/mcp"
            echo 'Cloud Run publicly accessible; no Auth0 / no OAuth.'
            echo 'Only the runtime can access Secret Manager HMAC; requests are signed to canonical WebApp.'
            echo 'Risk: any Internet caller can invoke available MCP tools, including unit grade recalculation.'
            echo 'Deployment performs no Classroom grade mutation.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify live health and anonymous MCP handshake (read-only)
        shell: bash
        run: |
          set -euo pipefail
          BASE="${MCP_ENDPOINT%/mcp}"
          # Diagnose the public endpoint using metadata only; never read HMAC or grades.
          gcloud run services describe academic-classroom-mcp-oauth \
            --project classroom-mcp-512122 --region us-central1 --format=json |
            jq '{service:.metadata.name,ingress:.metadata.annotations["run.googleapis.com/ingress"],defaultUrlDisabled:.metadata.annotations["run.googleapis.com/default-url-disabled"],statusUrl:.status.url,ready:.status.conditions[-1].status}'
          status="$(curl --silent --show-error --max-time 30 -o /tmp/mcp-health-body -D /tmp/mcp-health-headers -w '%{http_code}' "$BASE/health")"
          head -n 16 /tmp/mcp-health-headers
          if [[ "$status" != 200 ]]; then
            echo "Cloud Run health HTTP status: $status"
            head -c 700 /tmp/mcp-health-body
            exit 1
          fi
          python3 -c 'import json; d=json.load(open("/tmp/mcp-health-body")); assert d["status"]=="ok" and d["auth"]=="anonymous"'
          curl --fail --silent --show-error --max-time 30 "$MCP_ENDPOINT" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-healthcheck","version":"1"}}}' >/dev/null
