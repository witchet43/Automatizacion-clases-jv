name: Execute Apps Script Canonical Entrypoint

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: Canonical Apps Script function
        required: true
        type: choice
        options:
          - diagnosticarInfraestructuraEjecucion
          - generarSiguienteClase
          - generarSiguienteClaseSistemasDistribuidos
          - repararDraftsSesion15SistemasDistribuidos
          - verificarQuizPruebaCorreoVerificado
          - repararQuizPruebaCorreoVerificado
          - crearQuiz
          - crearPractica
          - crearTarea
          - crearActividad
          - crearQuizSencillo
          - importarCalificacionesAhora
          - cerrarUnidadConSiguienteVerificadaAhora
          - recalcularYPublicarUnidadSolicitadaAhora
          - instalarMonitorErroresAcademicos
          - validarConfiguracionNotificacionesErrores
          - instalarMonitorSolicitudesImportacion
      parameters_json:
        description: JSON array of function parameters
        required: true
        default: '[]'
        type: string
  push:
    branches: [main]
    paths:
      - '.automation/requests/**'

jobs:
  execute:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: apps-script-execution
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Resolve request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            request="$(git diff-tree --no-commit-id --name-only -r HEAD -- '.automation/requests/*.json' | tail -n1)"
            test -n "$request" || { echo 'No request file changed in triggering commit.' >&2; exit 1; }
            echo "FUNCTION_NAME=$(node -p "require('./${request}').function")" >> "$GITHUB_ENV"
            echo "PARAMETERS_JSON=$(node -p "JSON.stringify(require('./${request}').parameters || [])")" >> "$GITHUB_ENV"
          else
            echo 'FUNCTION_NAME=${{ inputs.function_name }}' >> "$GITHUB_ENV"
            echo 'PARAMETERS_JSON=${{ inputs.parameters_json }}' >> "$GITHUB_ENV"
          fi
      - name: Invoke official Apps Script Execution API and verify resources
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm run apps-script:run -- --function "$FUNCTION_NAME" --parameters-json "$PARAMETERS_JSON"
