name: Execute Apps Script Canonical Entrypoint

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: Canonical Apps Script function
        required: true
        type: choice
        options:
          - auditarClassroomSistemasOperativosITQ
          - diagnosticarInfraestructuraEjecucion
          - validarReadinessAcademicoCompleto
          - validarPlaneacionesCanonicasReadOnly
          - dryRunPreflightAcademico
          - diagnosticarQuizAsistenciaClaseActiva
          - generarSiguienteClase
          - generarSiguienteClaseSistemasDistribuidos
          - repararDraftsSesion15SistemasDistribuidos
          - verificarQuizPruebaCorreoVerificado
          - repararQuizPruebaCorreoVerificado
          - crearQuiz
          - crearPractica
          - crearTarea
          - crearActividad
          - crearQuizSencillo
          - crearQuizDeAsistencia
          - importarCalificacionesAhora
          - cerrarUnidadConSiguienteVerificadaAhora
          - recalcularYPublicarUnidadSolicitadaAhora
          - instalarMonitorErroresAcademicos
          - validarConfiguracionNotificacionesErrores
          - instalarMonitorSolicitudesImportacion
      parameters_json:
        description: JSON array of function parameters
        required: true
        default: '[]'
        type: string
  push:
    branches: [main]
    paths:
      - '.automation/requests/**'

jobs:
  execute:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: apps-script-execution
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Resolve request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            request="$(git diff-tree --no-commit-id --name-only -r HEAD -- '.automation/requests/*.json' | tail -n1)"
            test -n "$request" || { echo 'No request file changed in triggering commit.' >&2; exit 1; }
            echo "FUNCTION_NAME=$(node -p "require('./${request}').function")" >> "$GITHUB_ENV"
            echo "PARAMETERS_JSON=$(node -p "JSON.stringify(require('./${request}').parameters || [])")" >> "$GITHUB_ENV"
          else
            echo 'FUNCTION_NAME=${{ inputs.function_name }}' >> "$GITHUB_ENV"
            echo 'PARAMETERS_JSON=${{ inputs.parameters_json }}' >> "$GITHUB_ENV"
          fi
      - name: Wait for successful Apps Script deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-apps-script.yml/runs?branch=main&per_page=1"
          for attempt in $(seq 1 60); do
            payload="$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$api")"
            status="$(printf '%s' "$payload" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j.workflow_runs?.[0]?.status||'missing')})")"
            conclusion="$(printf '%s' "$payload" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j.workflow_runs?.[0]?.conclusion||'')})")"
            sha="$(printf '%s' "$payload" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j.workflow_runs?.[0]?.head_sha||'')})")"
            echo "Latest deploy: status=$status conclusion=$conclusion sha=$sha"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success" || { echo "Latest Apps Script deployment did not succeed." >&2; exit 1; }
              exit 0
            fi
            test "$status" != "missing" || { echo "No Apps Script deployment run found." >&2; exit 1; }
            sleep 5
          done
          echo "Timed out waiting for Apps Script deployment." >&2
          exit 1

      - name: Invoke official Apps Script Execution API and verify resources
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm run apps-script:run -- --function "$FUNCTION_NAME" --parameters-json "$PARAMETERS_JSON"
