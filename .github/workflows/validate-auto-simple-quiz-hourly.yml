name: Validate Hourly Simple Quiz

on:
  push:
    paths:
      - 'src/00_SolicitudImportacionCalificaciones.gs'
      - 'src/33_QuizSencillo.gs'
      - 'src/45_QuizAsistenciaClaseActiva.gs'
      - 'src/64_QuizAsistenciaRapido.gs'
      - 'scripts/test-minimal-academic-operations.mjs'
      - 'src/47_AutoQuizSencilloHorario.gs'
      - '.github/workflows/validate-auto-simple-quiz-hourly.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          for f in src/00_SolicitudImportacionCalificaciones.gs src/33_QuizSencillo.gs src/45_QuizAsistenciaClaseActiva.gs src/46_UnidadAbiertaQuizSencillo.gs src/47_AutoQuizSencilloHorario.gs; do
            cp "$f" "/tmp/$(basename "$f").js"
            node --check "/tmp/$(basename "$f").js"
          done
      - name: Verify hourly single-operation contract
        run: node scripts/test-minimal-academic-operations.mjs
