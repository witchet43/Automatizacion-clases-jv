name: Quiz Asistencia Directo

on:
  push:
    branches: [main]
    paths:
      - '.attendance-requests/**'

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Crear Quiz de Asistencia
        shell: bash
        run: |
          set -euo pipefail
          request_file="$(git diff-tree --no-commit-id --name-only -r HEAD -- '.attendance-requests/*.json' | tail -n1)"
          test -n "$request_file"

          course="$(jq -r '.course' "$request_file")"
          request_id="$(jq -r '.requestId' "$request_file")"
          test "$course" = "so"
          test -n "$request_id"
          test "$request_id" != "null"

          response="$(curl -fsSL --get             --data-urlencode "action=quizAsistencia"             --data-urlencode "course=$course"             --data-urlencode "requestId=$request_id"             "https://script.google.com/macros/s/AKfycbwS5oWDQyUlFaQ5OfwHdI8QjI-RwOdq8MsoPtIiY4iug-vYcHYJwBTBvgfu_rjrl5hR/exec")"

          echo "$response"
          echo "$response" | jq -e '.ok == true and .state == "DRAFT" and (.workId | type == "string" and length > 0)' >/dev/null
