name: Quiz Asistencia Directo

on:
  push:
    branches: [main]
    paths:
      - '.attendance-requests/**'

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --silent

      - name: Restaurar acceso clasp
        shell: bash
        run: |
          printf '%s' '${{ secrets.CLASPRC_JSON }}' > .clasprc.json
          chmod 600 .clasprc.json

      - name: Crear Quiz de Asistencia
        shell: bash
        env:
          clasp_config_auth: .clasprc.json
        run: |
          set -euo pipefail
          request_file="$(git diff-tree --no-commit-id --name-only -r HEAD -- '.attendance-requests/*.json' | tail -n1)"
          test -n "$request_file"

          course="$(jq -r '.course' "$request_file")"
          request_id="$(jq -r '.requestId' "$request_file")"
          test "$course" = "so"
          test -n "$request_id"
          test "$request_id" != "null"

          params="$(jq -cn --arg courseId "875776451793" --arg requestId "$request_id" '[{courseId:$courseId,requestId:$requestId}]')"
          response="$(npx clasp run-function crearQuizAsistencia --params "$params")"

          echo "$response"
          echo "$response" | grep -q '"state":"DRAFT"'
          echo "$response" | grep -q '"workId"'
