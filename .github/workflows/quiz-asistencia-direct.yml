name: Quiz Asistencia Directo

on:
  push:
    branches: [main]
    paths:
      - '.attendance-requests/**'

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Crear Quiz de Asistencia vía Web App
        shell: bash
        run: |
          set -euo pipefail
          request_file="$(git diff-tree --no-commit-id --name-only -r HEAD -- '.attendance-requests/*.json' | tail -n1)"
          test -n "$request_file"

          course="$(python -c "import json;print(json.load(open('$request_file'))['course'])")"
          test -n "$course"

          base="https://script.google.com/macros/s/AKfycbwvhillpOawsMRFwVjRx4iiO4IbVZcTgFE8-ZXvesVlwEhtrooqmS-8DQ2huxKWp3e6/exec"
          response="$(curl -fsSL --max-time 30 "$base?action=quizAsistencia&course=$course")"

          echo "$response"
          printf '%s' "$response" | grep -q '"ok":true'
          printf '%s' "$response" | grep -q '"state":"DRAFT"'
          printf '%s' "$response" | grep -q '"workId"'
