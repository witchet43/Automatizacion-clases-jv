name: Validate Simple Quiz

on:
  push:
    paths:
      - 'src/00_PoliticasCanonicas.gs'
      - 'src/00_SolicitudImportacionCalificaciones.gs'
      - 'src/22_EntrypointsRecursosSeguros.gs'
      - 'src/33_QuizSencillo.gs'
      - 'src/34_SolicitudCrearQuizSencillo.gs'
      - 'src/64_QuizAsistenciaRapido.gs'
      - 'scripts/test-minimal-academic-operations.mjs'
      - '.github/workflows/validate-simple-quiz.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          for f in src/00_PoliticasCanonicas.gs src/00_SolicitudImportacionCalificaciones.gs src/22_EntrypointsRecursosSeguros.gs src/33_QuizSencillo.gs src/34_SolicitudCrearQuizSencillo.gs src/46_UnidadAbiertaQuizSencillo.gs; do
            cp "$f" "/tmp/$(basename "$f").js"
            node --check "/tmp/$(basename "$f").js"
          done
      - name: Verify minimal attendance contract and regression
        run: node scripts/test-minimal-academic-operations.mjs
