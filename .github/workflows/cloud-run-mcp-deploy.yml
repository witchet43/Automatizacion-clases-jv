name: Deploy Classroom MCP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mcp-cloud-run/**', '.github/workflows/cloud-run-mcp-deploy.yml']
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: classroom-mcp-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify source syntax and dependency resolution
        working-directory: mcp-cloud-run
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Build and push Docker image without Cloud Build
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project classroom-mcp-512122
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          IMAGE="us-central1-docker.pkg.dev/classroom-mcp-512122/cloud-run-source-deploy/academic-classroom-mcp:${GITHUB_SHA}"
          docker build --platform linux/amd64 -t "$IMAGE" ./mcp-cloud-run
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy private service
        shell: bash
        run: |
          gcloud run deploy academic-classroom-mcp \
            --project classroom-mcp-512122 \
            --region us-central1 \
            --image "$IMAGE" \
            --service-account classroom-mcp-sa@classroom-mcp-512122.iam.gserviceaccount.com \
            --set-env-vars ENABLE_ACADEMIC_WRITES=false \
            --set-secrets MCP_BEARER_TOKEN=classroom-mcp-token:1 \
            --memory 512Mi --min-instances 0 --max-instances 1 \
            --no-allow-unauthenticated --quiet
      - name: Verify deployed revision
        run: |
          gcloud run services describe academic-classroom-mcp --region us-central1 --format='yaml(status.url,status.traffic)'
      - name: Update public ChatGPT gateway with safe status-only registration route
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL="$(python3 -c "import json;print(json.load(open('config/academic-context.json'))['webApp']['url'])")"
          [[ "$CANONICAL" == https://script.google.com/macros/s/*/exec ]]
          gcloud run deploy academic-classroom-chatgpt-gateway \
            --project classroom-mcp-512122 \
            --region us-central1 \
            --image "$IMAGE" \
            --service-account classroom-mcp-sa@classroom-mcp-512122.iam.gserviceaccount.com \
            --set-env-vars "ACADEMIC_WEBAPP_URL=$CANONICAL,ENABLE_ACADEMIC_WRITES=false" \
            --set-secrets MCP_BEARER_TOKEN=classroom-mcp-token:1 \
            --no-invoker-iam-check \
            --memory 512Mi --min-instances 0 --max-instances 1 --quiet
      - name: Verify public route is status-only, academic MCP is protected
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(gcloud run services describe academic-classroom-chatgpt-gateway --region us-central1 --format='value(status.url)')"
          for i in $(seq 1 12); do
            STATUS="$(curl --silent --show-error --max-time 20 -o /tmp/mcp-status -w '%{http_code}' \
              "$BASE/mcp-status" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"read-only-smoke","version":"0.1.0"}}}' || true)"
            if [[ "$STATUS" == 200 ]]; then break; fi
            sleep 2
          done
          echo "Status-only MCP initialize HTTP $STATUS"
          test "$STATUS" = 200
          PROTECTED="$(curl --silent --show-error --max-time 20 -o /tmp/protected -w '%{http_code}' \
            "$BASE/mcp" -H 'Content-Type: application/json' -d '{}')"
          echo "Academic MCP without key HTTP $PROTECTED"
          test "$PROTECTED" = 401
      - name: Publish deploy result for automated inspection
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# Classroom MCP deployment result"
            echo "Status: ${{ job.status }}"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Writes remain disabled by deployment configuration."
          } > /tmp/deploy-result.md
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Classroom MCP deploy ${GITHUB_RUN_ID}: ${{ job.status }}" \
            --body-file /tmp/deploy-result.md
