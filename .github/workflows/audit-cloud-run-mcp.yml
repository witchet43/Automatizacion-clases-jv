name: Audit Academic MCP Cloud Run
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-cloud-run-mcp.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect existing Cloud Run service without mutations
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=classroom-mcp-512122
          REGION=us-central1
          SERVICE=academic-classroom-mcp-oauth
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > /tmp/service.json
          gcloud run revisions list --service "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > /tmp/revisions.json
          echo "## Cloud Run audit (read-only)" >> "$GITHUB_STEP_SUMMARY"
          echo '### Service / revision / traffic' >> "$GITHUB_STEP_SUMMARY"
          jq '{service:.metadata.name,url:.status.url,latestCreated:.status.latestCreatedRevisionName,latestReady:.status.latestReadyRevisionName,traffic:.status.traffic}' /tmp/service.json
          jq -r '.[] | [.metadata.name, (.spec.containers[0].image // "unknown"), (.status.conditions[-1].status // "unknown")] | @tsv' /tmp/revisions.json
          echo 'See job logs for full revision and traffic data.' >> "$GITHUB_STEP_SUMMARY"

      - name: Inventory all academic Cloud Run services and request-log evidence (read-only)
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=classroom-mcp-512122
          REGION=us-central1
          echo '### Legacy service inventory (metadata and aggregate request counts only)' >> "$GITHUB_STEP_SUMMARY"
          for SERVICE in academic-classroom-mcp academic-classroom-chatgpt-gateway academic-classroom-mcp-oauth; do
            echo "SERVICE: $SERVICE"
            if ! gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > /tmp/classroom-service.json 2>/tmp/classroom-service-error; then
              echo "  Metadata: NOT_READABLE_OR_MISSING"
              echo "- $SERVICE: metadata not readable or missing" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            jq -r '"  URL: " + (.status.url // "unavailable"),
                   "  LatestReady: " + (.status.latestReadyRevisionName // "unavailable"),
                   "  Traffic: " + ((.status.traffic // []) | map((.revisionName // .revision // "latest")+":"+((.percent // 0)|tostring)+"%") | join(","))' /tmp/classroom-service.json
            # Only the timestamps of request logs; no URLs, request bodies, headers or identities.
            # A missing log is NOT proof of zero traffic (retention/IAM can mask activity).
            for DAYS in 7 30; do
              FILTER="resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE AND logName=projects/$PROJECT/logs/run.googleapis.com%2Frequests AND timestamp>=\"$(date -u -d "$DAYS days ago" +'%Y-%m-%dT%H:%M:%SZ')\""
              if gcloud logging read "$FILTER" --project "$PROJECT" --limit=1000 --format='value(timestamp)' > /tmp/classroom-request-times 2>/tmp/classroom-log-error; then
                COUNT="$(wc -l < /tmp/classroom-request-times | tr -d ' ')"
                RECENT="$(sort -r /tmp/classroom-request-times | sed -n '1p')"
                echo "  RequestLog_${DAYS}d: sampled_count=$COUNT (max 1000), latest=${RECENT:-none}"
                echo "- $SERVICE: request-log timestamps in ${DAYS}d: $COUNT sampled (max 1000); latest ${RECENT:-none}" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "  RequestLog_${DAYS}d: INCONCLUSIVE (Cloud Logging access or logging unavailable)"
                echo "- $SERVICE: ${DAYS}d logging inconclusive; do not delete" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done

      - name: Probe active MCP endpoints with Python standard library
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import sys

          with open('/tmp/service.json') as f:
              official = json.load(f)['status']['url']
          configured = 'https://academic-classroom-mcp-oauth-148028894895.us-central1.run.app'
          paths = ['/health', '/.well-known/oauth-protected-resource', '/mcp']
          failures = 0
          for base in dict.fromkeys([official, configured]):
              print('BASE_URL:', base, flush=True)
              for path in paths:
                  data = None
                  headers = {}
                  if path == '/mcp':
                      data = json.dumps({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-03-26','capabilities':{},'clientInfo':{'name':'cloudrun-audit','version':'1.0'}}}).encode()
                      headers = {'Content-Type':'application/json','Accept':'application/json, text/event-stream','MCP-Protocol-Version':'2025-03-26'}
                  req = urllib.request.Request(base + path, data=data, headers=headers, method='POST' if data else 'GET')
                  try:
                      with urllib.request.urlopen(req, timeout=15) as response:
                          print(path, 'HTTP_STATUS=', response.status, 'BODY=', response.read(500).decode('utf-8','replace'), flush=True)
                  except urllib.error.HTTPError as error:
                      print(path, 'HTTP_STATUS=',error.code, 'BODY=', error.read(500).decode('utf-8','replace'), flush=True)
                  except Exception as error:
                      failures += 1
                      print(path, 'NETWORK_ERROR=', repr(error), flush=True)
          if failures:
              print('NETWORK_ERRORS:', failures, flush=True)
              sys.exit(1)
          PY

      - name: List deployed MCP tools and verify gateway_status exists
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,json,sys
          url='https://academic-classroom-mcp-oauth-148028894895.us-central1.run.app/mcp'
          req=urllib.request.Request(url,data=json.dumps({'jsonrpc':'2.0','id':2,'method':'tools/list','params':{}}).encode(),headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream','MCP-Protocol-Version':'2025-03-26'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  data=r.read(200000).decode('utf-8','replace')
                  print('TOOLS_HTTP:',r.status)
                  print('TOOLS_RESPONSE:',data[:18000])
          except urllib.error.HTTPError as err:
              print('TOOLS_HTTP:',err.code,err.read(500).decode('utf-8','replace'))
              sys.exit(1)
          lines=[line[6:] for line in data.splitlines() if line.startswith('data: ')]
          try:
              obj=json.loads(lines[0] if lines else data)
              names=[tool['name'] for tool in obj.get('result',{}).get('tools',[])]
          except Exception as e:
              print('UNPARSEABLE_TOOLS_LIST:',repr(e));sys.exit(1)
          print('TOOL_NAMES:',json.dumps(names))
          if 'gateway_status' not in names:
              print('GATEWAY_STATUS_NOT_EXPOSED_BY_DEPLOYED_MCP')
              sys.exit(1)
          print('GATEWAY_STATUS_EXPOSED_BY_DEPLOYED_MCP')
          PY

      - name: Invoke gateway_status on deployed MCP (read only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,json,sys
          url='https://academic-classroom-mcp-oauth-148028894895.us-central1.run.app/mcp'
          req=urllib.request.Request(url,data=json.dumps({'jsonrpc':'2.0','id':3,'method':'tools/call','params':{'name':'gateway_status','arguments':{}}}).encode(),headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream','MCP-Protocol-Version':'2025-03-26'},method='POST')
          with urllib.request.urlopen(req,timeout=20) as r:
              data=r.read(30000).decode('utf-8','replace')
              print('GATEWAY_STATUS_HTTP:',r.status)
              print('GATEWAY_STATUS_RESPONSE:',data)
              assert r.status==200
              assert '"isError":true' not in data and '"error"' not in data
          PY

      - name: Verify Auth0 OAuth discovery using GET only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          issuer='https://dev-67cfevmusm7px130.us.auth0.com'
          for path in ('/.well-known/oauth-authorization-server',
                       '/.well-known/openid-configuration'):
              request=urllib.request.Request(issuer+path,method='GET',
                  headers={'Accept':'application/json'})
              with urllib.request.urlopen(request,timeout=15) as response:
                  status=response.status
                  metadata=json.load(response)
              if status!=200:
                  raise RuntimeError('OAUTH_DISCOVERY_HTTP_'+str(status))
              print('AUTH0_DISCOVERY_GET',path,'OK')
              print('AUTH0_DCR_ADVERTISED',bool(metadata.get('registration_endpoint')))
              print('AUTH0_PKCE_S256_SUPPORTED',
                  'S256' in metadata.get('code_challenge_methods_supported',[]))
          print('AUTH0_READONLY_DISCOVERY_COMPLETED')
          PY
