name: Audit Academic MCP Cloud Run
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect existing Cloud Run service without mutations
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=classroom-mcp-512122
          REGION=us-central1
          SERVICE=academic-classroom-mcp-oauth
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > /tmp/service.json
          gcloud run revisions list --service "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > /tmp/revisions.json
          echo "## Cloud Run audit (read-only)" >> "$GITHUB_STEP_SUMMARY"
          echo '### Service / revision / traffic' >> "$GITHUB_STEP_SUMMARY"
          jq '{service:.metadata.name,url:.status.url,latestCreated:.status.latestCreatedRevisionName,latestReady:.status.latestReadyRevisionName,traffic:.status.traffic}' /tmp/service.json
          jq -r '.[] | [.metadata.name, (.spec.containers[0].image // "unknown"), (.status.conditions[-1].status // "unknown")] | @tsv' /tmp/revisions.json
          echo 'See job logs for full revision and traffic data.' >> "$GITHUB_STEP_SUMMARY"
