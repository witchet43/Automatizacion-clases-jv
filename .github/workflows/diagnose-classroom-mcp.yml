name: Diagnose Classroom MCP HTTPS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-classroom-mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Diagnose auth and service reachability
        shell: bash
        run: |
          set -uo pipefail
          gcloud config set project classroom-mcp-512122
          gcloud run services describe academic-classroom-mcp --region us-central1 --format='yaml(status.url,status.conditions,status.traffic)' || echo "Service describe failed"
          : > /tmp/route-results.txt
          # A public endpoint returns Google 404 before reaching Express if Cloud Run
          # identity authentication or routing fails. Capture the HTTP response safely.
          for url in "https://academic-classroom-mcp-148028894895.us-central1.run.app" "https://academic-classroom-mcp-egncivfxav-uc.a.run.app"; do
            for path in /healthz /mcp; do
              echo "Checking $url$path"
              curl --silent --show-error --max-time 20 -o /tmp/classroom-mcp-response -w 'HTTP %{http_code}; content-type %{content_type}\n' "$url$path" || echo "Network failure"
              head -c 180 /tmp/classroom-mcp-response 2>/dev/null || true
              echo
            done
          done
          echo "Diagnostic completed (read-only, no deployment)."
      - name: Publish diagnosis to issue (sanitized, no credentials)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/diagnosis.md <<'EOF'
          # Classroom MCP: unattended connection diagnostic
          This run tests the remote Cloud Run service without modifying Google Classroom.
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Workflow result: ${{ job.status }}
          - Deployment operations: none
          - Secret values: never included
          EOF
          echo '### HTTP responses' >> /tmp/diagnosis.md
          echo '~~~text' >> /tmp/diagnosis.md
          cat /tmp/route-results.txt >> /tmp/diagnosis.md 2>/dev/null || echo "HTTP probing failed to start" >> /tmp/diagnosis.md
          echo '~~~' >> /tmp/diagnosis.md
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "MCP diagnostic run ${GITHUB_RUN_ID}: ${{ job.status }}" --body-file /tmp/diagnosis.md

