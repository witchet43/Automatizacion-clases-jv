name: Diagnose Classroom MCP HTTPS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-classroom-mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  statuses: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect service and probe both hostnames
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project classroom-mcp-512122
          gcloud run services describe academic-classroom-mcp --region us-central1 --format='yaml(status.url,status.conditions,status.traffic)'
          TOKEN="$(gcloud auth print-identity-token)"
          declare -a urls=(
            "https://academic-classroom-mcp-148028894895.us-central1.run.app"
            "https://academic-classroom-mcp-egncivfxav-uc.a.run.app"
          )
          healthy=0
          : > /tmp/mcp-diagnostic-summary
          for url in "${urls[@]}"; do
            echo "::group::Probing ${url}"
            for route in /healthz /mcp; do
              code="$(curl --silent --show-error --max-time 20 -o /tmp/mcp-response -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" "${url}${route}" || true)"
              echo "Route ${route} => HTTP ${code}"
              printf "%s%s=%s " "${url##https://}" "${route}" "${code}" >> /tmp/mcp-diagnostic-summary
              head -c 250 /tmp/mcp-response || true
              echo
              if [[ "${route}" == "/healthz" && "${code}" == "200" ]] && grep -q '"status":"ok"' /tmp/mcp-response; then healthy=1; fi
              if [[ "${route}" == "/mcp" && "${code}" == "401" ]] && grep -q 'unauthorized' /tmp/mcp-response; then healthy=1; fi
            done
            echo "::endgroup::"
          done
          echo "health=$healthy" >> /tmp/mcp-diagnostic-summary
          if [[ "${healthy}" != 1 ]]; then
            echo "::error::Neither Cloud Run hostname returned an expected application response. Do not deploy blindly."
            exit 1
          fi
      - name: Publish result as GitHub commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          details="$(cat /tmp/mcp-diagnostic-summary 2>/dev/null | tail -c 125 || true)"
          if [[ "${JOB_STATUS}" == "success" ]]; then result=success; else result=failure; fi
          # Publish compact route-specific statuses so the GitHub connector can read HTTP codes.
          for item in $(cat /tmp/mcp-diagnostic-summary 2>/dev/null | tr ' ' '\\n' | grep -E '=([0-9]{3}|000) \
            -f state="${result}" \
            -f context="classroom-mcp/remote-http" \
            -f description="${details:-Diagnose workflow failed before HTTP probe}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions"
 || true); do
            route="${item%%=*}"
            http="${item##*=}"
            case "${http}" in
              200|401|405) result_route=success ;;
              *) result_route=failure ;;
            esac
            route_key="$(echo "${route}" | sed -E 's@https://@@; s@[^a-zA-Z0-9]+@-@g' | cut -c1-85)"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="${result_route}" -f context="mcp/${route_key}" -f description="HTTP ${http}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions"
          done
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${result}" \
            -f context="classroom-mcp/remote-http" \
            -f description="${details:-Diagnose workflow failed before HTTP probe}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions"
