name: Diagnose Classroom MCP HTTPS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-classroom-mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: cloud_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://academic-classroom-mcp-egncivfxva-uc.a.run.app
      - uses: google-github-actions/setup-gcloud@v2
      - name: Test private MCP as authorized deployer
        env:
          CLOUD_RUN_ID_TOKEN: ${{ steps.cloud_auth.outputs.id_token }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe academic-classroom-mcp --project classroom-mcp-512122 --region us-central1 --format='yaml(status.url,status.traffic)'
          test -n "$CLOUD_RUN_ID_TOKEN"
          : > /tmp/route-results.txt
          for url in "https://academic-classroom-mcp-egncivfxva-uc.a.run.app" "https://academic-classroom-mcp-148028894895.us-central1.run.app"; do
            for path in /mcp /healthz; do
              status="$(curl -sS -o /tmp/response -w '%{http_code}' --max-time 20 -H "Authorization: Bearer $CLOUD_RUN_ID_TOKEN" "$url$path")"
              echo "$url$path => HTTP $status" | tee -a /tmp/route-results.txt
              if [[ "$path" == "/mcp" && "$status" == 401 ]]; then
                echo "Reached Express app authentication middleware" | tee -a /tmp/route-results.txt
                exit 0
              fi
              if [[ "$path" == "/healthz" && "$status" == 200 ]] && grep -q '"status":"ok"' /tmp/response; then
                echo "Reached Express health endpoint" | tee -a /tmp/route-results.txt
                exit 0
              fi
            done
          done
          echo "No app response received; see HTTP codes above" | tee -a /tmp/route-results.txt
          exit 1
      - name: Publish status to issue without secrets
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# MCP private HTTPS authentication diagnostic"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Result: ${{ job.status }}"
            echo '~~~text'
            cat /tmp/route-results.txt 2>/dev/null || echo 'Failed before HTTP probe (inspect auth action logs)'
            echo '~~~'
          } > /tmp/diagnosis.md
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "MCP private auth ${GITHUB_RUN_ID}: ${{ job.status }}" --body-file /tmp/diagnosis.md
