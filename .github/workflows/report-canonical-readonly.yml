name: Report canonical Classroom read-only check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/report-canonical-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find latest canonical Academic Web App run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/academic-webapp.yml/runs?per_page=20" > /tmp/runs.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/runs.json'))
          target=[r for r in data.get('workflow_runs',[]) if r.get('event')=='push']
          if not target: raise SystemExit('No canonical workflow runs found')
          run=target[0]
          with open('/tmp/readonly-report.md','w') as f:
            f.write('# Canonical academic read-only verification\n')
            f.write('Workflow: Academic Web App\n')
            f.write('Result: '+str(run.get('conclusion') or run.get('status'))+'\n')
            f.write('Execution: '+run.get('html_url','')+'\n')
            f.write('Commit: '+run.get('head_sha','')+'\n')
            f.write('This is execution metadata only: no Classroom content, identifiers or secrets.\n')
          print('latest canonical run:',run.get('id'),run.get('conclusion'))
          PY
      - name: Record outcome for ChatGPT GitHub connector
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Canonical Classroom read-only execution result ${GITHUB_RUN_ID}" \
            --body-file /tmp/readonly-report.md
