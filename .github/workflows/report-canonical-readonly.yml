name: Report canonical Classroom execution
on:
  workflow_run:
    workflows: ['Academic Web App']
    types: [completed]
permissions:
  contents: read
  issues: write
jobs:
  report:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish sanitized canonical workflow outcome
        env:
          GH_TOKEN: ${{ github.token }}
          ACADEMIC_RUN_URL: ${{ github.event.workflow_run.html_url }}
          ACADEMIC_RUN_ID: ${{ github.event.workflow_run.id }}
          ACADEMIC_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          ACADEMIC_RUN_RESULT: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Canonical Classroom WebApp execution metadata"
            echo "Workflow: Academic Web App"
            echo "Result: $ACADEMIC_RUN_RESULT"
            echo "Execution: $ACADEMIC_RUN_URL"
            echo "Commit: $ACADEMIC_RUN_SHA"
            echo "No Classroom content, student data or secrets included."
          } > /tmp/academic-report.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Canonical Classroom execution $ACADEMIC_RUN_ID: $ACADEMIC_RUN_RESULT" \
            --body-file /tmp/academic-report.md
