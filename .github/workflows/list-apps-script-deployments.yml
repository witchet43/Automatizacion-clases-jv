name: List Apps Script Deployments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/list-apps-script-deployments.yml'

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Restore clasp credentials
        shell: bash
        run: |
          printf '%s' '${{ secrets.CLASPRC_JSON }}' > .clasprc.json
          chmod 600 .clasprc.json
      - name: List deployments
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp deployments
