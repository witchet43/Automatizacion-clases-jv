name: Validate Simple Quiz Aliases

on:
  push:
    paths:
      - 'src/01_QuizSencilloIntentAliases.gs'
      - '.github/workflows/validate-simple-quiz-aliases.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical aliases
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const code = fs.readFileSync('src/01_QuizSencilloIntentAliases.gs', 'utf8');
          const context = {};
          vm.createContext(context);
          vm.runInContext(code, context);

          const expected = ['Quiz Sencillo', 'Quiz Simple', 'Quiz de Asistencia'];
          for (const alias of expected) {
            const resolved = context.resolverIntentoRecursoCanonico_(alias);
            if (!resolved || resolved.tipo !== 'QUIZ_SENCILLO' || resolved.entrypoint !== 'crearQuizSencillo') {
              throw new Error(`Alias no resuelto al flujo canónico: ${alias}`);
            }
          }

          if (context.resolverIntentoRecursoCanonico_('Quiz') !== null) {
            throw new Error('"Quiz" a secas no debe mapearse a QUIZ_SENCILLO.');
          }

          console.log('Simple quiz aliases OK');
          NODE
