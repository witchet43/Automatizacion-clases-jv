name: Inspect Existing Clasp Profiles

on:
  push:
    branches: [main]
    paths:
      - '.clasp-inspect/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect non-secret clasp metadata
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node <<'NODE'
          const raw = process.env.CLASPRC_JSON || '';
          const cfg = JSON.parse(raw);
          const sanitize = (obj) => {
            if (!obj || typeof obj !== 'object') return obj;
            const out = {};
            for (const [k,v] of Object.entries(obj)) {
              if (/token|secret|client_id|client_secret|id_token|access|refresh/i.test(k)) {
                if (k === 'tokens' && v && typeof v === 'object') {
                  out.tokens = {};
                  for (const [name,t] of Object.entries(v)) {
                    out.tokens[name] = {
                      keys: Object.keys(t || {}),
                      scope: t && t.scope ? t.scope : null
                    };
                  }
                } else {
                  out[k] = '[REDACTED]';
                }
              } else if (typeof v === 'object') {
                out[k] = sanitize(v);
              } else {
                out[k] = v;
              }
            }
            return out;
          };
          console.log(JSON.stringify(sanitize(cfg), null, 2));
          NODE
