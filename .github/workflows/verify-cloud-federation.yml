name: Verify Google Cloud federation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-cloud-federation.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read-only verification of current service
        run: |
          gcloud config set project classroom-mcp-512122
          gcloud run services describe academic-classroom-mcp --region us-central1 --format='yaml(status.url,status.traffic)'
