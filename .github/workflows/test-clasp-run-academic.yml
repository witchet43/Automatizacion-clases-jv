name: Test clasp run academic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-clasp-run-academic.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Restore clasp credentials
        shell: bash
        run: |
          printf '%s' '${{ secrets.CLASPRC_JSON }}' > .clasprc.json
          chmod 600 .clasprc.json
      - name: Test read-only clasp run
        env:
          clasp_config_auth: .clasprc.json
        shell: bash
        run: |
          npx clasp run resolverSiguienteClase --params '["Análisis y Diseño de Sistemas Computacionales"]'
