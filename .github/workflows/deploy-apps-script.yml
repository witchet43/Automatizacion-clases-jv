name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'
      - 'package.json'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

concurrency:
  group: apps-script-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate Apps Script source
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          for file in src/*.gs; do
            test -f "$file" || continue
            target="$tmp_dir/$(basename "$file").js"
            cp "$file" "$target"
            node --check "$target"
          done
          node -e "JSON.parse(require('fs').readFileSync('src/appsscript.json', 'utf8')); console.log('appsscript.json OK')"

      - name: Enforce architecture contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('src/00_ContratoArquitectura.gs', 'utf8');
          const required = [
            /BEHAVIOR_SOURCE:\s*'CODE'/,
            /AI_ROLE:\s*'INTENT_AND_MINIMAL_PARAMETERS'/,
            /PROMPT_ALGORITHM_RECONSTRUCTION_ALLOWED:\s*false/,
            /BEHAVIOR_CHANGE_REQUIRES_CODE:\s*true/,
            /BEHAVIOR_CHANGE_REQUIRES_REGRESSION:\s*true/,
            /DOCUMENTATION_IS_EXECUTION_SOURCE:\s*false/,
            /DEPLOYMENT_VERIFICATION_REQUIRED:\s*true/,
            /SILENT_SCRIPT_FAILURE_ALLOWED:\s*false/
          ];
          if (required.some(re => !re.test(text))) process.exit(1);
          console.log('Architecture contract OK');
          NODE

      - name: Enforce canonical academic policy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('src/00_PoliticasCanonicas.gs', 'utf8');
          const required = [
            /RESOURCE_CREATION_MODE:\s*'DIRECT_SCRIPT'/,
            /SHEETS_ROLE:\s*'AUDIT_AND_CONFIGURATION_ONLY'/,
            /MONITOR_REQUIRED_FOR_CREATION:\s*false/,
            /NOTIFY_ON_ERROR:\s*true/,
            /SILENT_FAILURE_ALLOWED:\s*false/,
            /PRIMARY_CHANNEL:\s*'EMAIL'/,
            /PRESERVE_ORIGINAL_EXCEPTION:\s*true/,
            /DEFAULT_COURSEWORK_STATE:\s*'DRAFT'/,
            /AUTOMATIC_GRADE_FIELD:\s*'draftGrade'/,
            /AUTOMATIC_ASSIGNED_GRADE:\s*false/,
            /AUTOMATIC_RETURN:\s*false/,
            /EXAM_WEIGHT:\s*0\.70/,
            /NON_EXAM_WEIGHT:\s*0\.30/,
            /MISSING_GRADE_VALUE:\s*0/,
            /TOUCH_OTHER_UNITS:\s*false/,
            /FINAL_ROUNDING:\s*'NEAREST_INTEGER'/,
            /RECALC_OVERWRITES_FINAL_DRAFT:\s*true/,
            /STANDARD_ITEM_COUNT:\s*25/,
            /STANDARD_TOTAL_POINTS:\s*100/,
            /PRACTICE_REFLECTION_COUNT:\s*3/,
            /MAX_SLIDES:\s*25/,
            /CANONICAL_SOURCE:\s*'CLASSROOM_COURSE_CALENDAR'/,
            /PRIMARY_ALLOWED_AS_CANONICAL:\s*false/
          ];
          if (required.some(re => !re.test(text))) process.exit(1);
          console.log('Canonical academic policy OK');
          NODE

      - name: Enforce direct resource creation API
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const legacyFile = 'src/20_CreacionDirectaRecursos.gs';
          const safeFile = 'src/22_EntrypointsRecursosSeguros.gs';
          if (!fs.existsSync(legacyFile) || !fs.existsSync(safeFile)) process.exit(1);
          const direct = fs.readFileSync(legacyFile, 'utf8');
          const safe = fs.readFileSync(safeFile, 'utf8');
          const engineRequired = [
            /crearCourseWorkDirecto_/,
            /crearEvaluacionDirecta_/,
            /registrarAuditoriaCourseWorkDirecto_/,
            /registrarAuditoriaEvaluacionDirecta_/,
            /verificarCourseWorkDraftDirecto_/
          ];
          const safeRequired = [
            /function\s+crearActividad\s*\(/,
            /function\s+crearTarea\s*\(/,
            /function\s+crearPractica\s*\(/,
            /function\s+crearQuiz\s*\(/,
            /function\s+crearExamen\s*\(/,
            /ejecutarConNotificacionError_/
          ];
          if (engineRequired.some(re => !re.test(direct)) || safeRequired.some(re => !re.test(safe))) process.exit(1);
          console.log('Direct resource creation API OK');
          NODE

      - name: Enforce script error notification
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const notifier = fs.readFileSync('src/21_NotificacionErrores.gs', 'utf8');
          const entrypoints = fs.readFileSync('src/22_EntrypointsRecursosSeguros.gs', 'utf8');
          const operations = fs.readFileSync('src/15_OperacionesAcademicas.gs', 'utf8');
          const dispatcher = fs.readFileSync('src/00_SolicitudImportacionCalificaciones.gs', 'utf8');
          const requiredNotifier = [
            /function\s+ejecutarConNotificacionError_\s*\(/,
            /function\s+notificarErrorScript_\s*\(/,
            /MailApp\.sendEmail\s*\(/,
            /function\s+vigilarErroresOperativos\s*\(/,
            /function\s+instalarMonitorErroresAcademicos\s*\(/,
            /ERROR_NOTIFICATION\.LAST_ERROR_PROPERTY/,
            /throw\s+err;/
          ];
          if (requiredNotifier.some(re => !re.test(notifier))) process.exit(1);
          const fiveEntrypoints = ['crearActividad','crearTarea','crearPractica','crearQuiz','crearExamen'];
          if (fiveEntrypoints.some(name => !new RegExp('function\\s+' + name + '\\s*\\(').test(entrypoints))) process.exit(1);
          if (!/ejecutarConNotificacionError_/.test(entrypoints)) process.exit(1);
          if (!/IMPORTAR_CALIFICACIONES_EXAMEN/.test(operations) || !/CERRAR_UNIDAD/.test(operations) || !/ejecutarConNotificacionError_/.test(operations)) process.exit(1);
          if (!/notificarErrorScript_/.test(dispatcher)) process.exit(1);
          console.log('Script error notification policy OK');
          NODE

      - name: Enforce draft-only automatic grading
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const files = fs.readdirSync('src').filter(f => f.endsWith('.gs'));
          const violations = [];
          for (const file of files) {
            const text = fs.readFileSync(path.join('src', file), 'utf8');
            const patches = text.match(/StudentSubmissions\.patch\s*\(\s*\{[\s\S]{0,700}?\}\s*,/gm) || [];
            for (const patch of patches) {
              const matches = [...patch.matchAll(/assignedGrade\s*:\s*([^,}\n]+)/g)];
              for (const m of matches) if (String(m[1] || '').trim() !== 'null') violations.push(`${file}: writes non-null assignedGrade`);
            }
            if (/StudentSubmissions\.return\s*\(/m.test(text)) violations.push(`${file}: automatically returns a submission`);
          }
          if (violations.length) {
            console.error(violations.join('\n'));
            process.exit(1);
          }
          console.log('Draft-only grading policy OK');
          NODE

      - name: Restore clasp credentials
        shell: bash
        run: |
          printf '%s' '${{ secrets.CLASPRC_JSON }}' > .clasprc.json
          chmod 600 .clasprc.json

      - name: Deploy to Google Apps Script
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp push --force

      - name: Run isolated in-class activity rule test
        if: contains(github.event.head_commit.message, '[test-activity-class]')
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp run probarActividadClaseHoyMiPruebaSO

      - name: Install script-error monitor
        if: contains(github.event.head_commit.message, '[setup-error-monitor]')
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp run instalarMonitorErroresAcademicos

      - name: Verify script-error notification configuration
        if: contains(github.event.head_commit.message, '[setup-error-monitor]')
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp run validarConfiguracionNotificacionesErrores

      - name: Install grade-import request monitor
        if: contains(github.event.head_commit.message, '[setup-import-trigger]')
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp run instalarMonitorSolicitudesImportacion

      - name: Import quiz grades on demand
        if: contains(github.event.head_commit.message, '[import-grades]')
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp run importarCalificacionesAhora

      - name: Close unit with verified next-unit hint
        if: contains(github.event.head_commit.message, '[cerrar-unidad-hint]')
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp run cerrarUnidadConSiguienteVerificadaAhora

      - name: Recalculate unit grade draft only
        if: contains(github.event.head_commit.message, '[recalcular-publicar-unidad]')
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp run recalcularYPublicarUnidadSolicitadaAhora
