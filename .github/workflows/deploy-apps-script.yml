name: Deploy Apps Script
# Redeploy marker: retry canonical Web App deployment after verified HTTP 403 on 2026-10-06.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/test-*.mjs'
      - 'scripts/academic-context.mjs'
      - 'scripts/verify-academic-webapp.mjs'
      - 'config/academic-context.json'
      - '.clasp.json'
      - 'package.json'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Verify canonical context and startup regressions
        run: |
          node scripts/academic-context.mjs check
          node scripts/test-academic-context.mjs
          node scripts/test-operation-contracts.mjs

      - name: Validate Apps Script source
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          for file in src/*.gs; do
            test -f "$file" || continue
            target="$tmp_dir/$(basename "$file").js"
            cp "$file" "$target"
            node --check "$target"
          done
          node -e "JSON.parse(require('fs').readFileSync('src/appsscript.json', 'utf8')); console.log('appsscript.json OK')"

      - name: Regression - transversal read-only academic audit
        run: node scripts/test-auditoria-transversal.mjs

      - name: Regression - audit reconciles completed sessions without publishing
        run: node scripts/test-auditar-y-completar.mjs

      - name: Regression - next class follows real Classroom and verified Gamma, never today
        run: node scripts/test-next-class-real-state.mjs

      - name: Regression - every Google Doc gives each student an editable copy
        run: node scripts/test-google-doc-student-copy.mjs

      - name: Regression - Google Forms must remain unpublished drafts
        run: node scripts/test-forms-draft.mjs

      - name: Regression - Google Forms grades import without TURNED_IN
        run: node scripts/test-forms-import-without-turnedin.mjs

      - name: Regression - academic error alerts are not duplicated
        run: node scripts/test-academic-error-notifications.mjs

      - name: Regression - minimal operations and attendance consecutives
        run: node scripts/test-minimal-academic-operations.mjs

      - name: Regression - closure drafts retry and preserve manual grades
        run: node scripts/test-grade-closure-resilience.mjs

      - name: Enforce architecture contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('src/00_ContratoArquitectura.gs', 'utf8');
          const required = [
            /BEHAVIOR_SOURCE:\s*'CODE'/,
            /AI_ROLE:\s*'INTENT_AND_MINIMAL_PARAMETERS'/,
            /REMOTE_TRANSPORT:\s*'WEB_APP'/,
            /PUBLIC_WEBAPP_SCOPE:\s*'DIDACTIC_MATERIALIZATION'/,
            /PROMPT_ALGORITHM_RECONSTRUCTION_ALLOWED:\s*false/,

            /BEHAVIOR_CHANGE_REQUIRES_CODE:\s*true/,
            /BEHAVIOR_CHANGE_REQUIRES_REGRESSION:\s*true/,
            /DOCUMENTATION_IS_EXECUTION_SOURCE:\s*false/,
            /DEPLOYMENT_VERIFICATION_REQUIRED:\s*true/,
            /SILENT_SCRIPT_FAILURE_ALLOWED:\s*false/
          ];
          if (required.some(re => !re.test(text))) process.exit(1);
          console.log('Architecture contract OK');
          NODE

      - name: Enforce canonical academic policy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('src/00_PoliticasCanonicas.gs', 'utf8');
          const required = [
            /RESOURCE_CREATION_MODE:\s*'DIRECT_SCRIPT'/,
            /REMOTE_TRANSPORT:\s*'WEB_APP'/,
            /PUBLIC_WEBAPP_SCOPE:\s*'DIDACTIC_MATERIALIZATION'/,
            /SHEETS_ROLE:\s*'AUDIT_AND_CONFIGURATION_ONLY'/,
            /MONITOR_REQUIRED_FOR_CREATION:\s*false/,
            /NOTIFY_ON_ERROR:\s*true/,
            /SILENT_FAILURE_ALLOWED:\s*false/,
            /PRIMARY_CHANNEL:\s*'EMAIL'/,
            /PRESERVE_ORIGINAL_EXCEPTION:\s*true/,
            /DEFAULT_COURSEWORK_STATE:\s*'DRAFT'/,
            /AUTOMATIC_GRADE_FIELD:\s*'draftGrade'/,
            /AUTOMATIC_ASSIGNED_GRADE:\s*false/,
            /AUTOMATIC_RETURN:\s*false/,
            /REQUIRE_CLASSROOM_TURNED_IN:\s*false/,
            /REQUIRE_COMPLETE_FORMS_SCORE:\s*true/,
            /REQUIRE_EXACT_EMAIL_IDENTITY:\s*true/,
            /WRITE_ONLY_DRAFT_GRADE:\s*true/,
            /ACTIVITY_IN_CLASS_DUE:\s*Object\.freeze/,
            /DEFAULT:\s*'SESSION_END'/,
            /MAXIMUM:\s*'SESSION_END'/,
            /PAST_SESSION_CREATION:\s*'BLOCK'/,
            /TASK_DUE:\s*Object\.freeze/,
            /DEFAULT:\s*'NEXT_SESSION_START'/,
            /MAXIMUM:\s*'NEXT_SESSION_START'/,
            /PAST_NEXT_SESSION_CREATION:\s*'BLOCK'/,
            /DUE_MUST_BE_FUTURE:\s*true/,
            /PRACTICE:\s*Object\.freeze/,
            /DUE_MODE:\s*'NONE'/,
            /DUE_ALLOWED:\s*false/,
            /GOOGLE_DOCUMENT_REQUIRED:\s*true/,
            /GOOGLE_DOCUMENT_MIME:\s*'application\/vnd\.google-apps\.document'/,
            /STUDENT_COPY_REQUIRED:\s*true/,
            /SHARE_MODE:\s*'STUDENT_COPY'/,
            /CREATE_GOOGLE_DOCUMENT_IF_MISSING:\s*true/,
            /PRACTICE_DOCUMENT_FORMAT:\s*'GOOGLE_DOC'/,
            /EXAM_WEIGHT:\s*0\.70/,
            /NON_EXAM_WEIGHT:\s*0\.30/,
            /MISSING_GRADE_VALUE:\s*0/,
            /TOUCH_OTHER_UNITS:\s*false/,
            /FINAL_ROUNDING:\s*'NEAREST_INTEGER'/,
            /RECALC_OVERWRITES_FINAL_DRAFT:\s*true/,
            /STANDARD_ITEM_COUNT:\s*25/,
            /STANDARD_TOTAL_POINTS:\s*100/,
            /PRACTICE_REFLECTION_COUNT:\s*3/,
            /MAX_SLIDES:\s*25/,
            /CANONICAL_SOURCE:\s*'CLASSROOM_COURSE_CALENDAR'/,
            /PRIMARY_ALLOWED_AS_CANONICAL:\s*false/
          ];
          if (required.some(re => !re.test(text))) process.exit(1);
          console.log('Canonical academic policy OK');
          NODE

      - name: Enforce canonical didactic Web App API
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'src/20_CreacionDirectaRecursos.gs',
            'src/22_EntrypointsRecursosSeguros.gs',
            'src/24_VencimientoActividadClase.gs',
            'src/27_VencimientoTarea.gs',
            'src/30_PracticaConGoogleDoc.gs',
            'src/64_QuizAsistenciaRapido.gs',
            'src/65_QuizAsistenciaWebApp.gs',
            'src/appsscript.json'
          ];
          if (files.some(file => !fs.existsSync(file))) process.exit(1);
          const direct = fs.readFileSync(files[0], 'utf8');
          const safe = fs.readFileSync(files[1], 'utf8');
          const activityDue = fs.readFileSync(files[2], 'utf8');
          const taskDue = fs.readFileSync(files[3], 'utf8');
          const practice = fs.readFileSync(files[4], 'utf8');
          const attendance = fs.readFileSync(files[5], 'utf8');
          const web = fs.readFileSync(files[6], 'utf8');
          const manifest = JSON.parse(fs.readFileSync(files[7], 'utf8'));
          const requiredActions = ['quizAsistencia','actividad','tarea','practica','quiz','examen','material','clase','resolverClase'];
          const failed =
            !/crearCourseWorkDirecto_/.test(direct) ||
            !/crearEvaluacionDirecta_/.test(direct) ||
            !/function\s+crearActividad\s*\(/.test(safe) ||
            !/function\s+crearTarea\s*\(/.test(safe) ||
            !/function\s+crearPractica\s*\(/.test(safe) ||
            !/function\s+crearQuiz\s*\(/.test(safe) ||
            !/function\s+crearExamen\s*\(/.test(safe) ||
            !/SESSION_END/.test(activityDue) ||
            !/NEXT_SESSION_START/.test(taskDue) ||
            !/STUDENT_COPY/.test(practice) ||
            !/function\s+crearQuizAsistenciaRapido\s*\(/.test(attendance) ||
            requiredActions.some(action => !web.includes("'" + action + "'")) ||
            !/function\s+doPost\s*\(/.test(web) ||
            !/executeAs\s*":\s*"USER_DEPLOYING"/.test(JSON.stringify(manifest)) ||
            !/access\s*":\s*"ANYONE_ANONYMOUS"/.test(JSON.stringify(manifest)) ||
            Object.prototype.hasOwnProperty.call(manifest,'executionApi');
          if (failed) process.exit(1);
          console.log('Canonical didactic Web App API OK');
          NODE

      - name: Enforce script error notification
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const notifier = fs.readFileSync('src/21_NotificacionErrores.gs', 'utf8');
          const entrypoints = fs.readFileSync('src/22_EntrypointsRecursosSeguros.gs', 'utf8');
          const operations = fs.readFileSync('src/15_OperacionesAcademicas.gs', 'utf8');
          const dispatcher = fs.readFileSync('src/00_SolicitudImportacionCalificaciones.gs', 'utf8');
          const requiredNotifier = [
            /function\s+ejecutarConNotificacionError_\s*\(/,
            /function\s+notificarErrorScript_\s*\(/,
            /MailApp\.sendEmail\s*\(/,
            /function\s+vigilarErroresOperativos\s*\(/,
            /function\s+instalarMonitorErroresAcademicos\s*\(/,
            /ERROR_NOTIFICATION\.LAST_ERROR_PROPERTY/,
            /throw\s+err;/
          ];
          if (requiredNotifier.some(re => !re.test(notifier))) process.exit(1);
          const fiveEntrypoints = ['crearActividad','crearTarea','crearPractica','crearQuiz','crearExamen'];
          if (fiveEntrypoints.some(name => !new RegExp('function\\s+' + name + '\\s*\\(').test(entrypoints))) process.exit(1);
          if (!/ejecutarConNotificacionError_/.test(entrypoints)) process.exit(1);
          if (!/IMPORTAR_CALIFICACIONES_EXAMEN/.test(operations) || !/CERRAR_UNIDAD/.test(operations) || !/ejecutarConNotificacionError_/.test(operations)) process.exit(1);
          if (!/notificarErrorScript_/.test(dispatcher)) process.exit(1);
          console.log('Script error notification policy OK');
          NODE

      - name: Enforce draft-only automatic grading
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const files = fs.readdirSync('src').filter(f => f.endsWith('.gs'));
          const violations = [];
          for (const file of files) {
            const text = fs.readFileSync(path.join('src', file), 'utf8');
            const patches = text.match(/StudentSubmissions\.patch\s*\(\s*\{[\s\S]{0,700}?\}\s*,/gm) || [];
            for (const patch of patches) {
              const matches = [...patch.matchAll(/assignedGrade\s*:\s*([^,}\n]+)/g)];
              for (const m of matches) if (String(m[1] || '').trim() !== 'null') violations.push(`${file}: writes non-null assignedGrade`);
            }
            if (/StudentSubmissions\.return\s*\(/m.test(text)) violations.push(`${file}: automatically returns a submission`);
          }
          if (violations.length) {
            console.error(violations.join('\n'));
            process.exit(1);
          }
          console.log('Draft-only grading policy OK');
          NODE

      - name: Restore clasp credentials
        shell: bash
        run: |
          printf '%s' '${{ secrets.CLASPRC_JSON }}' > .clasprc.json
          chmod 600 .clasprc.json

      - name: Enable and list manifest advanced services
        env:
          clasp_config_auth: .clasprc.json
        shell: bash
        run: |
          set -euo pipefail
          for api in drive classroom calendar; do
            npx clasp enable-api "$api"
          done
          npx clasp apis

      - name: Deploy to Google Apps Script
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp push --force

      - name: Update canonical Web App deployment
        env:
          clasp_config_auth: .clasprc.json
        shell: bash
        run: |
          set -euo pipefail
          npm run apps-script:deploy

      - name: Verify deployed Web App without creating resources
        run: node scripts/verify-academic-webapp.mjs
