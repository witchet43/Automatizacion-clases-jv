name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'
      - 'package.json'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

concurrency:
  group: apps-script-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate Apps Script source
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          for file in src/*.gs; do
            test -f "$file" || continue
            target="$tmp_dir/$(basename "$file").js"
            cp "$file" "$target"
            node --check "$target"
          done
          node -e "JSON.parse(require('fs').readFileSync('src/appsscript.json', 'utf8')); console.log('appsscript.json OK')"

      - name: Enforce draft-only automatic grading
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'assignedGrade[[:space:]]*:' src --include='*.gs'; then
            echo 'ERROR: automatic code must never write assignedGrade.' >&2
            exit 1
          fi
          if grep -R -n -E 'StudentSubmissions\.return[[:space:]]*\(' src --include='*.gs'; then
            echo 'ERROR: automatic grading must never return submissions.' >&2
            exit 1
          fi
          echo 'Draft-only grading policy OK'

      - name: Restore clasp credentials
        shell: bash
        run: |
          printf '%s' '${{ secrets.CLASPRC_JSON }}' > .clasprc.json
          chmod 600 .clasprc.json

      - name: Deploy to Google Apps Script
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp push --force

      - name: Install grade-import request monitor
        if: contains(github.event.head_commit.message, '[setup-import-trigger]')
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp run instalarMonitorSolicitudesImportacion

      - name: Import quiz grades on demand
        if: contains(github.event.head_commit.message, '[import-grades]')
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp run importarCalificacionesAhora

      - name: Close unit with verified next-unit hint
        if: contains(github.event.head_commit.message, '[cerrar-unidad-hint]')
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp run cerrarUnidadConSiguienteVerificadaAhora

      - name: Recalculate unit grade draft only
        if: contains(github.event.head_commit.message, '[recalcular-publicar-unidad]')
        env:
          clasp_config_auth: .clasprc.json
        run: npx clasp run recalcularYPublicarUnidadSolicitadaAhora
