name: Inspect Classroom MCP smoke failure
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-classroom-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Extract categorized smoke failure without printing secrets
        shell: bash
        run: |
          set -u
          gcloud logging read 'resource.type="cloud_run_job" AND resource.labels.job_name="classroom-mcp-smoke"' \
            --project classroom-mcp-512122 --freshness 4h --limit 80 --format=json >/tmp/smoke-logs.json 2>/tmp/read-error || true
          python3 - <<'PY'
          import json,re
          try: data=json.load(open('/tmp/smoke-logs.json'))
          except Exception: data=[]
          if not data:
              print('smoke_log_status=unavailable')
              print('permission_denied=', 'PERMISSION_DENIED' in open('/tmp/read-error').read())
          labels=['HTTP401','HTTP403','INVALID_CONTENT_TYPE','TIMEOUT','NETWORK','JSON_PARSE','MCP_ERROR','SCRIPT_ERROR','INIT_ERROR','UNKNOWN_ERROR']
          pats=[r'\\b401\\b',r'\\b403\\b',r'content.type|content-type',r'timeout|timed out|AbortError',r'fetch failed|ENOTFOUND|ECONN|network',r'SyntaxError|JSON',r'McpError|MCP error',r'TypeError|ReferenceError',r'initialize|handshake',r'error|fail|exception']
          for entry in data:
              v=str(entry.get('textPayload') or entry.get('jsonPayload') or '')
              for label,pat in zip(labels,pats):
                  if re.search(pat,v,re.I):print('smoke_error_category='+label);break
          print('smoke_log_count='+str(len(data)))
          PY
      - name: Report outcome
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "MCP smoke log investigation ${GITHUB_RUN_ID}: ${{ job.status }}" --body "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No secrets were printed. See categorized diagnostic in Actions logs."
