name: Test Classroom MCP discovery and authentication
on:
  pull_request:
    paths:
      - 'mcp-cloud-run/**'
      - '.github/workflows/test-cloud-run-mcp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate MCP contract, discovery and security
        working-directory: mcp-cloud-run
        run: |
          npm install --no-audit --no-fund
          npm run check
