# Reejecución tras cruce de IDs de Classroom, títulos 01/1 y Docs registrados.
name: One-time create canonical practice with script-owned Google Doc
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-auditoria-sistemas-distribuidos-2026.yml'
permissions:
  contents: read
concurrency:
  group: academic-reconciliation-sistemas-distribuidos-2026
  cancel-in-progress: false
jobs:
  audit-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify deployment is configured
        shell: bash
        run: |
          test -n "$(node -p "JSON.parse(require('fs').readFileSync('.apps-script-deployment.json','utf8')).deploymentId")"
      - name: Create canonical session 8 practice in DRAFT
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > parameters.json <<'AUDIT_S08_PARAMS'
          [{"courseId":"871158466533","materia":"UAQ - Sistemas Distribuidos","temaSubtema":"2.1.1 Cliente-servidor + 2.1.2 Peer-to-peer","sesionCanonica":8,"explicitSequenceOverride":true,"unidad":"Unidad 2","topicName":"Unidad 2","courseKey":"UAQ_SISTEMAS_DISTRIBUIDOS","titulo":"Práctica 07 - Comparar cliente-servidor con un intercambio entre pares","descripcion":"Contrasta cliente-servidor y P2P con ejecuciones controladas en Python; registra las salidas de ambos modelos, elabora dos diagramas comparativos y una tabla técnica de roles, estructura, tolerancia a fallos y limitaciones. Integra tu evidencia y conclusiones en tu copia individual del documento adjunto.","contenidoDocumento":"Práctica 7 - Comparar cliente-servidor con un intercambio entre pares\nPráctica 7 · Comparar cliente-servidor con un intercambio entre pares\nSoftware\nPython + VSCodium\nLicencia / acceso\nSoftware libre/open source\nEvidencia final\nSalida de ambos modelos y tabla comparativa.\n1. Objetivo\nEjecutar dos modelos de comunicación y distinguir roles fijos frente a roles intercambiables.\n2. Antes de comenzar\nNo empieces a capturar, programar o configurar nada hasta revisar esta lista:\nPython 3.\nVSCodium.\nDos terminales abiertas en el mismo equipo.\n3. Regla de trabajo\nEsta práctica está diseñada para realizarse paso a paso. No te saltes pasos. Después de cada acción, verifica que obtuviste el resultado esperado antes de continuar. Si algo no coincide, revisa la sección de errores frecuentes antes de pedir ayuda.\n4. Conceptos técnicos que necesitas conocer\nLee estas definiciones antes de abrir el software. Vuelve a consultarlas cuando aparezcan en los pasos; su función es ayudarte a interpretar lo que ves, no solamente a repetir un término.\ncliente-servidor: Es un modelo en el que uno o varios clientes solicitan funciones o datos a un servidor disponible en una dirección conocida.\npeer-to-peer (P2P): Es un modelo entre pares donde los participantes pueden actuar tanto como clientes como servidores.\ncliente: Es el proceso que inicia una solicitud para utilizar un servicio.\nservidor: Es el proceso que escucha solicitudes y entrega respuestas o recursos.\nproceso: Es un programa que se encuentra en ejecución. Dos procesos pueden comunicarse aunque estén en equipos diferentes.\nsocket: Es el punto de comunicación que una aplicación utiliza para enviar o recibir datos; suele asociarse con una dirección IP, un puerto y un protocolo de transporte.\npuerto: Es un número que permite al sistema operativo dirigir los datos al proceso o servicio correcto dentro de un equipo.\n5. Procedimiento paso a paso\nCrea una carpeta `P07_modelos_red`. Antes de avanzar, compara el resultado con lo indicado en este paso y anota cualquier diferencia.\nCrea `servidor.py` con un socket TCP que escuche en `127.0.0.1` puerto `5000`, acepte una conexión, reciba un mensaje y responda. Antes de avanzar, compara el resultado con lo indicado en este paso y anota cualquier diferencia.\nCrea `cliente.py` que se conecte a `127.0.0.1:5000`, envíe un mensaje y muestre la respuesta. Antes de avanzar, compara el resultado con lo indicado en este paso y anota cualquier diferencia.\nAbre dos terminales. En la primera ejecuta el servidor; en la segunda ejecuta el cliente. Antes de continuar, confirma que la herramienta inició sin errores y conserva visible el resultado.\nObserva que el servidor queda esperando y el cliente inicia la conexión. Antes de continuar, confirma que la herramienta inició sin errores y conserva visible el resultado.\nAhora crea `par.py` de modo que el programa pueda recibir un mensaje y también iniciar un envío según una opción elegida por el usuario. Antes de avanzar, compara el resultado con lo indicado en este paso y anota cualquier diferencia.\nEjecuta dos instancias del programa `par.py` usando puertos distintos, por ejemplo 6001 y 6002. Antes de continuar, confirma que la herramienta inició sin errores y conserva visible el resultado.\nHaz que el primer par envíe al segundo y después invierte el sentido. Antes de avanzar, compara el resultado con lo indicado en este paso y anota cualquier diferencia.\nRegistra qué papel desempeña cada proceso en cada momento. Verifica que la evidencia sea legible, incluya contexto y no exponga credenciales ni información personal.\nConstruye una tabla comparando: dependencia de servidor central, quién inicia, quién atiende y qué ocurre si un nodo se apaga. Antes de avanzar, compara el resultado con lo indicado en este paso y anota cualquier diferencia.\n6. ¿Qué debes observar?\nCliente-servidor concentra el servicio en un proceso servidor.\nEn P2P los nodos pueden alternar funciones.\nEl rol depende de la interacción concreta, no del dispositivo en sí.\n7. Evidencia que debes entregar\nSalida de ambos modelos y tabla comparativa.\nTu evidencia debe permitir que otra persona compruebe que realizaste la práctica. No entregues únicamente una captura sin contexto: acompaña cada imagen con una breve explicación de qué muestra y por qué es relevante. Define brevemente los términos técnicos que aparezcan en tu explicación y señala qué dato de la ejecución respalda cada conclusión.\n8. Errores frecuentes y cómo resolverlos\nProblema\nQué revisar\nAddress already in use\nCierra la instancia anterior o cambia el puerto.\nConnection refused\nEjecuta primero el proceso que debe estar escuchando.\nNo se comunican dos instancias\nVerifica que los puertos y la dirección de destino coincidan.\n9. Lista de verificación antes de entregar\n☐ Realicé todos los pasos principales de la práctica.\n☐ Mi evidencia corresponde a mi propia ejecución.\n☐ Incluí los datos o capturas solicitados.\n☐ Expliqué con mis palabras qué observé.\n☐ Relacioné la evidencia con el concepto de la clase.\n☐ Revisé que el archivo sea legible y que las capturas tengan contexto.\n10. Preguntas de cierre\nResponde brevemente al final de tu evidencia:\n¿Qué concepto de la clase pudiste observar o comprobar directamente con el software?\n¿Qué resultado te sorprendió o no esperabas?\nSi repitieras la práctica, ¿qué harías diferente para obtener evidencia más clara?","studentCopy":true,"puntos":100}]
          AUDIT_S08_PARAMS
          npm run apps-script:run -- --function crearPractica --parameters-json "$(cat parameters.json)"
