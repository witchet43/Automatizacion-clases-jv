# Reejecución tras cruce de IDs de Classroom, títulos 01/1 y Docs registrados.
name: One-time identify actual next class UAQ Sistemas Distribuidos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-auditoria-sistemas-distribuidos-2026.yml'
permissions:
  contents: read
concurrency:
  group: academic-reconciliation-sistemas-distribuidos-2026
  cancel-in-progress: false
jobs:
  audit-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify deployment is configured
        shell: bash
        run: |
          test -n "$(node -p "JSON.parse(require('fs').readFileSync('.apps-script-deployment.json','utf8')).deploymentId")"
      - name: Identify next class from real Classroom and Gamma state
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm run apps-script:run -- --function resolverSiguienteClase --parameters-json '["Sistemas Distribuidos"]'
