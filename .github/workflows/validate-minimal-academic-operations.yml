name: Validate Minimal Academic Operations
on:
  push:
    paths:
      - 'src/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'mcp-cloud-run/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/test-*.mjs'
      - '.github/workflows/validate-minimal-academic-operations.yml'
      - '.github/workflows/deploy-cloud-run-mcp.yml'
      - '.github/workflows/audit-classroom-mcp-wif.yml'
      - 'mcp-cloud-run/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce explicit platform-change authorization on main
        if: github.event_name == 'push'
        run: node scripts/assert-platform-change-authorized.mjs
      - name: Build canonical generated context
        run: node scripts/academic-context.mjs build
      - name: Check all Apps Script source syntax
        run: |
          set -euo pipefail
          for f in src/*.gs; do
            cp "$f" "/tmp/$(basename "$f").js"
            node --check "/tmp/$(basename "$f").js"
          done
      - name: Verify Apps Script deployments happen only when source changes
        run: node scripts/test-apps-script-source-gate.mjs
      - name: Verify GitHub WIF audit workflow is read-only and credential-safe
        run: node scripts/test-mcp-wif-audit-workflow.mjs
      - name: Verify MCP reuses existing audited GCP identity and secrets without disclosure
        run: node scripts/test-mcp-audited-gcp-config.mjs
      - name: Validate opt-in Secret Manager and least-privilege IAM bootstrap
        run: |
          bash -n scripts/preparar-mcp-iam-secrets.sh
          node scripts/test-mcp-iam-bootstrap.mjs
      - name: Validate Cloud Shell read-only audit syntax
        run: bash -n scripts/auditar-classroom-mcp-gcp.sh
      - name: Test independent OAuth MCP transport without connecting to Classroom
        run: |
          node mcp-cloud-run/sync-context.mjs
          cd mcp-cloud-run
          npm install --no-audit --no-fund
          npm run check
      - name: Exercise minimal-operation and academic regressions
        run: |
          node scripts/test-academic-write-auth.mjs
          node scripts/test-maintenance-properties.mjs
          node scripts/test-site-direct-write-client.mjs
          node scripts/test-exam-form-batch.mjs
          node scripts/test-webapp-error-diagnostics.mjs
          node scripts/test-task-due-optional.mjs
          node scripts/test-architecture-boundaries.mjs
          node scripts/test-decommissioned-routes.mjs
          node scripts/test-incident-regressions.mjs
          node scripts/test-static-webapp-contract.mjs
          node scripts/test-gamma-live-state-contract.mjs
          node scripts/test-class-package-reconciliation.mjs
          node scripts/test-academic-document-prose-regression.mjs
          node scripts/test-notion-class-notes-contract.mjs
          node scripts/test-quiz-policy-sequence-consistency.mjs
          node scripts/test-minimal-academic-operations.mjs
          node scripts/test-operation-contracts.mjs
          node scripts/test-next-class-real-state.mjs
          node scripts/test-exam-session-skip.mjs
          node scripts/test-auditoria-transversal.mjs
          node scripts/test-auditar-y-completar.mjs
          node scripts/test-google-doc-student-copy.mjs
          node scripts/test-practice-existing-doc-drive-file-fallback.mjs
          node scripts/test-practice-postflight-existing-doc.mjs
          node scripts/test-direct-coursework-draft-idempotency.mjs
          node scripts/test-forms-draft.mjs
          node scripts/test-quiz-exam-answer-bridge.mjs
          node scripts/test-forms-import-without-turnedin.mjs
          node scripts/test-academic-error-notifications.mjs
          node scripts/test-grade-closure-resilience.mjs
          node scripts/test-unit-grade-draft-idempotency.mjs
