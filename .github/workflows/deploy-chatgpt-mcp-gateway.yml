name: Deploy ChatGPT read-only MCP gateway
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-chatgpt-mcp-gateway.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: classroom-chatgpt-gateway
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy separate bearer-protected, read-only ChatGPT endpoint
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_IMAGE="$(gcloud run services describe academic-classroom-mcp --project classroom-mcp-512122 --region us-central1 --format='value(spec.template.spec.containers[0].image)')"
          test -n "$SOURCE_IMAGE"
          gcloud run deploy academic-classroom-chatgpt-gateway \
            --project classroom-mcp-512122 --region us-central1 \
            --image "$SOURCE_IMAGE" \
            --service-account classroom-mcp-sa@classroom-mcp-512122.iam.gserviceaccount.com \
            --set-env-vars ENABLE_ACADEMIC_WRITES=false \
            --set-secrets MCP_BEARER_TOKEN=classroom-mcp-token:1 \
            --no-invoker-iam-check \
            --memory 512Mi --min-instances 0 --max-instances 1 --quiet
          URL="$(gcloud run services describe academic-classroom-chatgpt-gateway --project classroom-mcp-512122 --region us-central1 --format='value(status.url)')"
          echo "Gateway URL: $URL"
          echo "URL=$URL" >> "$GITHUB_ENV"
      - name: Verify no-key access is rejected by application
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 30 -o /tmp/gateway-response -w '%{http_code}' "$URL/mcp")"
          echo "Unauthenticated /mcp HTTP $code"
          test "$code" = 401
          grep -q unauthorized /tmp/gateway-response
          echo "Read-only gateway is reachable and bearer auth enforced."
      - name: Report deployment and endpoint
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# Read-only ChatGPT MCP gateway deployment"
            echo "Result: ${{ job.status }}"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Endpoint: ${URL:-not deployed}"
            echo "Upstream: not configured"
            echo "Academic writes: disabled"
            echo "Application-level bearer authentication: enabled"
          } > /tmp/gateway-report.md
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "ChatGPT MCP gateway ${GITHUB_RUN_ID}: ${{ job.status }}" --body-file /tmp/gateway-report.md
