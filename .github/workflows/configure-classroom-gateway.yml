name: Configure canonical Classroom WebApp (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/configure-classroom-gateway.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Connect canonical WebApp to read-only gateway
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL="$(python3 -c "import json;print(json.load(open('config/academic-context.json'))['webApp']['url'])")"
          [[ "$CANONICAL" == https://script.google.com/macros/s/*/exec ]]
          gcloud run services update academic-classroom-chatgpt-gateway \
            --project classroom-mcp-512122 \
            --region us-central1 \
            --update-env-vars "ACADEMIC_WEBAPP_URL=$CANONICAL,ENABLE_ACADEMIC_WRITES=false" \
            --quiet
          URL="$(gcloud run services describe academic-classroom-chatgpt-gateway --project classroom-mcp-512122 --region us-central1 --format='value(status.url)')"
          CODE="$(curl -sS --max-time 30 -o /tmp/resp -w '%{http_code}' "$URL/mcp")"
          test "$CODE" = 401
          grep -q unauthorized /tmp/resp
          echo "Canonical upstream configured; write operations still disabled; bearer protection active"
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Gateway canonical WebApp configuration: ${{ job.status }}"
            echo "Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Academic writes: disabled"
          } >/tmp/classroom-report.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Classroom WebApp gateway config ${GITHUB_RUN_ID}: ${{ job.status }}" --body-file /tmp/classroom-report.md
