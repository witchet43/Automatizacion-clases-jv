name: Quiz Asistencia SO - Dos Funciones

on:
  push:
    branches: [main]
    paths:
      - '.two-function-run/**'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --silent
      - name: Restaurar autorización existente
        shell: bash
        run: |
          printf '%s' '${{ secrets.CLASPRC_JSON }}' > .clasprc.json
          chmod 600 .clasprc.json
      - name: Ejecutar exactamente dos funciones
        env:
          clasp_config_auth: .clasprc.json
        shell: bash
        run: |
          set -euo pipefail

          course_result="$(npx clasp run obtenerCourseIdPorNombre --params '["Sistemas Operativos"]')"
          echo "COURSE_RESULT=$course_result"

          course_id="$(printf '%s' "$course_result" | grep -oE '[0-9]{10,}' | tail -n1)"
          test -n "$course_id"

          quiz_result="$(npx clasp run crearQuizAsistenciaRapido --params "[\"$course_id\"]")"
          echo "QUIZ_RESULT=$quiz_result"

          printf '%s' "$quiz_result" | grep -q '"workId"'
          printf '%s' "$quiz_result" | grep -q '"state":"DRAFT"'
