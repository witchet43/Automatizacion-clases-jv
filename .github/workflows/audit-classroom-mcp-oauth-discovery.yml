name: Audit Classroom MCP OAuth Discovery (Read Only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-classroom-mcp-oauth-discovery.yml'
permissions:
  contents: read
  id-token: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Auth0 metadata and deployed anonymous MCP discovery without tokens or writes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request, urllib.error
          from urllib.parse import urlparse
          AUTH0='https://dev-67cfevmusm7px130.us.auth0.com'
          MCP='https://academic-classroom-mcp-oauth-148028894895.us-central1.run.app'
          def get(url,method='GET',payload=None):
              hdr={'Accept':'application/json'}
              if payload is not None:
                  hdr.update({'Content-Type':'application/json','Accept':'application/json, text/event-stream',
                              'MCP-Protocol-Version':'2025-06-18'})
              req=urllib.request.Request(url,headers=hdr,
                  data=json.dumps(payload).encode() if payload is not None else None,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      return r.status,r.read(500000).decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return e.code,e.read(2000).decode('utf-8','replace')
              except Exception as e:
                  return 'NETWORK_ERROR',type(e).__name__+': '+str(e)[:160]
          def parse_rpc(raw):
              for line in raw.splitlines():
                  if line.startswith('data: '): return json.loads(line[6:])
              return json.loads(raw)
          print('READ_ONLY_OAUTH_DISCOVERY_AUDIT_NO_TOKENS_NO_CLASSROOM_WRITES')
          oauth_endpoints=[
            '/.well-known/oauth-authorization-server',
            '/.well-known/openid-configuration'
          ]
          responses=[]
          for ep in oauth_endpoints:
              code,body=get(AUTH0+ep)
              print('AUTH0_DISCOVERY',ep,'HTTP',code)
              if code!=200:
                  print('AUTH0_RESPONSE_TYPE',body[:140] if isinstance(body,str) else code)
                  continue
              try: data=json.loads(body)
              except: print('AUTH0_JSON_INVALID');continue
              responses.append((ep,data))
              summary={
                'issuer':data.get('issuer'),
                'authorization_endpoint_host':urlparse(data.get('authorization_endpoint','')).hostname,
                'token_endpoint_host':urlparse(data.get('token_endpoint','')).hostname,
                'registration_endpoint_present':bool(data.get('registration_endpoint')),
                'registration_endpoint_path':urlparse(data.get('registration_endpoint','')).path,
                'S256_supported':'S256' in data.get('code_challenge_methods_supported',[]),
                'public_client_supported':'none' in data.get('token_endpoint_auth_methods_supported',[]),
                'CIMD_supported':data.get('client_id_metadata_document_supported') is True,
                'scopes_advertised':sorted(x for x in data.get('scopes_supported',[]) if x.startswith('academic.'))
              }
              print('AUTH0_METADATA_SUMMARY',json.dumps(summary,sort_keys=True))
          code,body=get(MCP+'/.well-known/oauth-protected-resource')
          print('MCP_RESOURCE_METADATA_HTTP',code)
          if code==200:
              data=json.loads(body)
              print('MCP_RESOURCE_METADATA',json.dumps({
                'resource':data.get('resource'),
                'authorization_servers':data.get('authorization_servers'),
                'scopes_supported':data.get('scopes_supported')},sort_keys=True))
          init={'jsonrpc':'2.0','id':1,'method':'initialize','params':{
            'protocolVersion':'2025-06-18','capabilities':{},
            'clientInfo':{'name':'academic-mcp-oauth-audit','version':'1'}}}
          code,body=get(MCP+'/mcp','POST',init)
          print('MCP_INITIALIZE_HTTP',code)
          if code==200:
              val=parse_rpc(body)
              print('MCP_INITIALIZE_PROTOCOL',val.get('result',{}).get('protocolVersion'))
          code,body=get(MCP+'/mcp','POST',{'jsonrpc':'2.0','id':2,'method':'tools/list','params':{}})
          print('MCP_TOOLS_LIST_HTTP',code)
          if code==200:
              tools=parse_rpc(body).get('result',{}).get('tools',[])
              print('MCP_TOOL_COUNT',len(tools))
              for t in tools:
                  print('MCP_TOOL_AUTH',t.get('name'),json.dumps(t.get('securitySchemes',[]),sort_keys=True))
          code,body=get(MCP+'/mcp','POST',{'jsonrpc':'2.0','id':3,'method':'tools/call','params':{
              'name':'gateway_status','arguments':{}}})
          print('MCP_READ_ONLY_GATEWAY_STATUS_HTTP',code)
          if code==200:
              result=parse_rpc(body).get('result',{})
              print('MCP_READ_ONLY_GATEWAY_STATUS_OK',not result.get('isError',False))
          print('AUTH0_DISCOVERY_ENDPOINTS_SUCCESSFUL',len(responses))
          print('NO_OAUTH_REGISTRATION_ATTEMPTED_NO_CLASSROOM_RESOURCES_MODIFIED')
          PY

      - name: Audit recent Cloud Run MCP request patterns from logs (aggregate only)
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/148028894895/locations/global/workloadIdentityPools/github-classroom-pool/providers/github
          service_account: classroom-mcp-deployer@classroom-mcp-512122.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Aggregate Cloud Run requests without IPs, identities, paths with query strings or bodies
        shell: bash
        run: |
          set -uo pipefail
          filter='resource.type="cloud_run_revision" AND resource.labels.service_name="academic-classroom-mcp-oauth" AND logName="projects/classroom-mcp-512122/logs/run.googleapis.com%2Frequests"'
          if ! gcloud logging read "$filter" --project classroom-mcp-512122 --freshness=6h --limit=500 --format=json > /tmp/mcp-request-logs.json 2>/tmp/mcp-read-error; then
            echo 'CLOUD_RUN_LOG_AGGREGATE_UNAVAILABLE: insufficient permission or API error; no IAM changes performed'
            exit 0
          fi
          python3 - <<'PY'
          import json,collections,urllib.parse
          with open('/tmp/mcp-request-logs.json') as f: rows=json.load(f)
          totals=collections.Counter()
          for row in rows:
              http=row.get('httpRequest') or {}
              path=urllib.parse.urlsplit(http.get('requestUrl') or '').path
              if path not in ('/mcp','/.well-known/oauth-protected-resource',
                              '/.well-known/oauth-protected-resource/mcp'):
                  continue
              user_agent=(http.get('userAgent') or '').lower()
              category=('github-python-client' if 'python-urllib' in user_agent
                else 'possible-openai-client' if any(x in user_agent for x in ('openai','chatgpt'))
                else 'other-or-unidentified')
              totals[(path,http.get('requestMethod','?'),http.get('status','?'),category)]+=1
          print('CLOUD_RUN_LAST_6_HOURS_MATCHED_REQUESTS',sum(totals.values()))
          print('CLOUD_RUN_LOG_SAMPLE_LIMIT',500)
          for key,n in sorted(totals.items()):
              print('REQUEST_AGGREGATE',*key,'COUNT',n)
          print('NO_IP_ADDRESS_NO_USER_AGENT_STRING_NO_TOKEN_NO_REQUEST_BODY_LOGGED')
          PY

      - name: Check Auth0 DCR switch without creating OAuth clients
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          # Registration requires redirect_uris, so an empty object cannot register a client.
          url='https://dev-67cfevmusm7px130.us.auth0.com/oidc/register'
          request=urllib.request.Request(url,data=b'{}',
            headers={'Content-Type':'application/json','Accept':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(request,timeout=15) as r:
                  status=r.status
                  raw=r.read(2500).decode('utf8','replace')
          except urllib.error.HTTPError as e:
              status=e.code
              raw=e.read(2500).decode('utf8','replace')
          except Exception as e:
              print('AUTH0_DCR_EMPTY_REQUEST_NETWORK_ERROR',type(e).__name__)
              raise
          print('AUTH0_DCR_EMPTY_REQUEST_HTTP',status)
          try:
              obj=json.loads(raw)
              print('AUTH0_DCR_ERROR_CODE',str(obj.get('error') or obj.get('code') or 'none')[:100])
              print('AUTH0_DCR_ERROR_TYPE',str(obj.get('error_description') or obj.get('message') or '')[:180])
          except ValueError:
              print('AUTH0_DCR_RESPONSE_NOT_JSON')
          if status in (200,201):
              raise RuntimeError('UNEXPECTED_REGISTRATION_SUCCESS_FOR_INVALID_EMPTY_PAYLOAD')
          print('AUTH0_DCR_PROBE_NO_CLIENT_CREATED_NO_CREDENTIALS_SUPPLIED')
          PY
