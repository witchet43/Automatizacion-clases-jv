name: Academic Web App

on:
  push:
    branches: [main]
    paths:
      - '.academic-requests/**'

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical configuration
        run: node scripts/academic-context.mjs check
      - name: Execute canonical academic Web App
        run: node scripts/execute-academic-request.mjs
