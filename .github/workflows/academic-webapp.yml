name: Academic Web App

# Transporte anterior retirado del disparo automatico.
# Las operaciones academicas de rutina viajan directamente a Web App.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce data-only academic request
        run: node scripts/assert-academic-request-data-only.mjs
      - name: Build and validate canonical configuration
        run: |
          node scripts/academic-context.mjs build
          node scripts/academic-context.mjs check
      - name: Execute canonical academic Web App
        run: node scripts/execute-academic-request.mjs
