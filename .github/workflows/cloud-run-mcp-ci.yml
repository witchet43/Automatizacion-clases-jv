name: MCP Cloud Run CI
on:
  pull_request:
    paths: ['mcp-cloud-run/**', '.github/workflows/cloud-run-mcp-*.yml']
  push:
    branches: ['feature/cloud-run-mcp-classroom']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-cloud-run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Test HTTP and MCP without Classroom
        run: |
          set -euo pipefail
          MCP_BEARER_TOKEN=ci-test-token ENABLE_ACADEMIC_WRITES=false node server.mjs >/tmp/mcp.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent localhost:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent localhost:8080/healthz | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/mcp -H 'Content-Type: application/json' -d '{}')" = 401
          curl --fail --silent -N -X POST localhost:8080/mcp -H 'Authorization: Bearer ci-test-token' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' | grep -q gateway_status
